<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily News English</title>
<style>
:root{--pri:#ff5722;--bg:#faf8f6;--card:#fff;--line:#eee;--txt:#1a1a1a;--sub:#888}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
.logo{color:var(--pri);font-weight:800;font-size:20px}
select{border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:14px;background:#fff;max-width:55%}
.card{margin:14px;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{background:var(--pri);color:#fff;font-weight:700;border-radius:20px;padding:8px 16px;font-size:14px}
.cnt{color:var(--sub);font-size:15px}
.tabs{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:#222;color:#fff;border-color:#222}
.tabs button.done::after{content:" ✓";color:#2bb673}
.tabs button.on.done::after{color:#7dffb7}
.s{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.s:last-child{border-bottom:0}
.s.playing{background:#fff6f2;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px}
.pb{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--pri);font-size:13px;cursor:pointer}
.en{font-size:19px;font-weight:700;line-height:1.55;cursor:pointer}
.ko{font-size:15px;color:var(--sub);line-height:1.5;margin-top:4px;display:none}
.ko.show{display:block}
mark{background:#fff0c2;border-radius:3px;padding:0 1px;color:inherit;border-bottom:2px solid #ffc83d}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0}
.row{display:flex;align-items:center;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
.row label{color:var(--sub);font-weight:700;font-size:14px}
.sp{border:1px solid var(--line);background:#fff;border-radius:20px;padding:10px 14px;font-weight:700;color:#666;cursor:pointer;font-size:14px}
.sp.on{background:var(--pri);border-color:var(--pri);color:#fff}
.all{width:100%;border:1.5px solid #222;background:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
.mic{background:#f6f4f2;border-radius:18px;padding:24px;text-align:center;margin-top:14px}
.mic button{width:96px;height:96px;border-radius:50%;border:0;background:var(--pri);font-size:38px;cursor:pointer;color:#fff}
.mic button.rec{animation:pulse 1s infinite;background:#d32f2f}
@keyframes pulse{50%{transform:scale(1.07)}}
.mic p{margin:14px 0 0;color:#555;font-weight:600}
.mic audio{width:100%;margin-top:12px}
.foot{text-align:center;color:var(--sub);padding:6px 0 80px;font-size:14px}
#tip{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;display:none;z-index:9;max-width:90%}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo">Daily News English</span><select id="dateSel"></select></header>
  <div id="app"><p style="padding:20px;color:#888">불러오는 중…</p></div>
</div>
<div id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

let idx = [], lesson = null, setI = 0, rate = 1, alwaysKo = false;
let playToken = 0, playingKey = null, voices = [];
let rec = null, chunks = [], recUrl = {}, recording = false;

/* ---------- 음성 ---------- */
function loadVoices() { voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en')); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  return voices.find(v => /Google US English|Samantha|Aaron|Microsoft (Aria|Jenny|Guy)/i.test(v.name))
      || voices.find(v => v.lang === 'en-US') || voices[0];
}
function speak(text, r) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = r;
    const v = pickVoice(); if (v) u.voice = v;
    u.onend = u.onerror = res;
    speechSynthesis.speak(u);
  });
}
function stopAll() { playToken++; playingKey = null; speechSynthesis.cancel(); }
async function playOne(i) {
  stopAll(); const t = playToken;
  await new Promise(r => setTimeout(r, 60));
  playingKey = i; paintPlaying();
  await speak(curSet().sentences[i].en, rate);
  if (t === playToken) { playingKey = null; paintPlaying(); }
}
async function playSet() {
  stopAll(); const t = playToken;
  await new Promise(r => setTimeout(r, 60));
  const ss = curSet().sentences;
  for (let i = 0; i < ss.length; i++) {
    if (t !== playToken) return;
    playingKey = i; paintPlaying();
    await speak(ss[i].en, rate);
    await new Promise(r => setTimeout(r, 250));
  }
  if (t === playToken) { playingKey = null; paintPlaying(); }
}
function paintPlaying() {
  document.querySelectorAll('.s').forEach((el, i) => el.classList.toggle('playing', i === playingKey));
}

/* ---------- 진행 기록 ---------- */
const doneKey = () => 'done_' + lesson.date;
const getDone = () => { try { return JSON.parse(localStorage.getItem(doneKey()) || '[]'); } catch { return []; } };
function markDone(i) { const d = getDone(); if (!d.includes(i)) { d.push(i); localStorage.setItem(doneKey(), JSON.stringify(d)); } }

/* ---------- 녹음 ---------- */
async function toggleRec() {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  try {
    stopAll();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      recUrl[setI] = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      recording = false; markDone(setI); render();
    };
    rec.start(); recording = true; render();
  } catch (e) { alert('마이크 권한이 필요합니다. (HTTPS 주소에서만 동작합니다)'); }
}

/* ---------- 렌더 ---------- */
const curSet = () => lesson.sets[setI];
function hl(s) {
  let h = esc(s.en);
  (s.words || []).forEach((w, i) => {
    const re = new RegExp('(^|[^\\w>])(' + reEsc(esc(w.w)) + ')(?![\\w<])', 'i');
    h = h.replace(re, (m, a, b) => `${a}<mark data-w="${i}">${b}</mark>`);
  });
  return h;
}
function render() {
  const sets = lesson.sets, done = getDone();
  const start = sets.slice(0, setI).reduce((n, s) => n + s.sentences.length, 0);
  const n = curSet().sentences.length;
  const tabs = sets.map((_, i) => `<button data-set="${i}" class="${i === setI ? 'on' : ''} ${done.includes(i) ? 'done' : ''}">세트 ${i + 1}</button>`).join('');
  $('#app').innerHTML = `
  <div class="card">
    <div class="top"><span class="badge">세트 ${setI + 1} · 문장 ${start + 1}~${start + n}</span><span class="cnt">${setI + 1} / ${sets.length}</span></div>
    <div style="font-weight:700;margin:10px 0 0">${esc(lesson.title || '')}</div>
    <div class="tabs">${tabs}</div>
    <div style="margin-top:6px">
    ${curSet().sentences.map((s, i) => `
      <div class="s" data-i="${i}">
        <button class="pb" data-play="${i}">▶</button>
        <div style="flex:1">
          <div class="en" data-tr="${i}">${hl(s)}</div>
          <div class="ko ${alwaysKo ? 'show' : ''}" id="ko${i}">${esc(s.ko || '')}</div>
        </div>
      </div>`).join('')}
    </div>
    <p class="hint">문장을 누르면 한글 번역, 노란 단어를 누르면 뜻이 나와요.</p>
    <label class="toggle"><input type="checkbox" id="alwaysKo" ${alwaysKo ? 'checked' : ''}> 번역 항상 보기</label>
    <div class="row"><label>배속</label>
      ${[0.5, 0.8, 1, 1.2, 1.5].map(r => `<button class="sp ${r === rate ? 'on' : ''}" data-rate="${r}">${r}×</button>`).join('')}
    </div>
    <button class="all" id="playAll">🔊 세트 전체 듣기 (${rate}×)</button>
    <div class="mic">
      <button id="micBtn" class="${recording ? 'rec' : ''}">${recording ? '■' : '🎙'}</button>
      <p>${recording ? '녹음 중… 다시 누르면 종료' : `탭해서 세트 ${setI + 1} 이어서 따라 말하기`}</p>
      ${recUrl[setI] ? `<audio controls src="${recUrl[setI]}"></audio>` : ''}
    </div>
  </div>
  <div class="foot">세트를 모두 녹음해 보면 오늘 학습 완료! (${done.length}/${sets.length})</div>`;
}

let tipTimer;
function tip(t) { const el = $('#tip'); el.textContent = t; el.style.display = 'block'; clearTimeout(tipTimer); tipTimer = setTimeout(() => el.style.display = 'none', 3000); }

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-set]')) { stopAll(); setI = +t.closest('[data-set]').dataset.set; render(); return; }
  if (t.closest('[data-play]')) { playOne(+t.closest('[data-play]').dataset.play); return; }
  if (t.closest('[data-rate]')) { rate = +t.closest('[data-rate]').dataset.rate; render(); return; }
  if (t.id === 'alwaysKo') { alwaysKo = t.checked; render(); return; }
  if (t.id === 'playAll') { playSet(); return; }
  if (t.closest('#micBtn')) { toggleRec(); return; }
  const mk = t.closest('mark');
  if (mk) {
    const i = +mk.closest('.s').dataset.i, w = curSet().sentences[i].words[+mk.dataset.w];
    tip(`${w.w} : ${w.ko}`);
    stopAll(); speak(w.w, rate);
    return;
  }
  const tr = t.closest('[data-tr]');
  if (tr) $('#ko' + tr.dataset.tr).classList.toggle('show');
});

/* ---------- 데이터 로드 ---------- */
async function loadLesson(date) {
  stopAll(); setI = 0; recUrl = {};
  const r = await fetch(`data/${date}.json?v=${Date.now()}`);
  if (!r.ok) { $('#app').innerHTML = '<p style="padding:20px">해당 날짜의 학습 자료가 없습니다.</p>'; return; }
  lesson = await r.json(); render();
}
(async function init() {
  try {
    const r = await fetch('data/index.json?v=' + Date.now());
    idx = (await r.json()).lessons.sort((a, b) => b.date.localeCompare(a.date));
  } catch { $('#app').innerHTML = '<p style="padding:20px">data/index.json 을 불러오지 못했습니다.</p>'; return; }
  const sel = $('#dateSel');
  sel.innerHTML = idx.map(l => `<option value="${l.date}">${l.date} · ${esc(l.title || '')}</option>`).join('');
  const want = new URLSearchParams(location.search).get('date');
  if (want && idx.some(l => l.date === want)) sel.value = want;
  sel.onchange = () => loadLesson(sel.value);
  if (idx.length) loadLesson(sel.value);
})();
</script>
</body>
</html>
