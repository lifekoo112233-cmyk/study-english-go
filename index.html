<style>
:root{--pri:#ff5722;--bg:#faf8f6;--line:#eee;--txt:#1a1a1a;--sub:#888}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5;min-height:56px}

.back.on{background:#fff3ee;color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.gray{background:#eee;color:#333}

.fcard{border:1px solid var(--line);border-radius:20px;padding:36px 20px;margin-top:14px;text-align:center;min-height:260px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:12px}

.two{display:flex;gap:10px;margin-top:14px}

.pad{padding:16px}

.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer}

.empty{color:var(--sub);text-align:center;padding:40px 10px;line-height:1.6}
label.l{display:block;font-size:13px;color:#666;margin:12px 0 4px}
input.t,textarea.t{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font-size:15px;font-family:inherit}

.prow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:#fcfcfc}

.pb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--pri);font-size:13px;cursor:pointer;font-weight:700}
.en{font-size:19px;font-weight:700;line-height:1.6}
.w{cursor:pointer;border-radius:4px}
.w:active{background:#ffe3a3}
.ko{font-size:15px;color:var(--sub);line-height:1.5;margin-top:4px;display:none}
.ko.show{display:block}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0}
.row{display:flex;align-items:center;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
.row label{color:var(--sub);font-weight:700;font-size:14px}
.opt{display:flex;align-items:flex-start;gap:8px;margin:8px 0}
.opt>label{flex:none;width:76px;padding-top:11px;color:var(--sub);font-weight:700;font-size:14px;line-height:1.3}
.opt>label small{display:block;color:var(--pri);font-size:12px;margin-top:2px}
.opt .chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.opt .chips>.sp{flex:1 1 0;min-width:0;height:40px;padding:0 4px;text-align:center;white-space:nowrap;line-height:1}
.opt .chips>.wide{flex:1 1 100%}
.opt .vname{flex:1 1 100%;margin:2px 0 0}
.w,.mw,.pb{touch-action:manipulation}
.sp{border:1px solid var(--line);background:#fff;border-radius:20px;padding:10px 14px;font-weight:700;color:#666;cursor:pointer;font-size:14px}
.sp.on{background:var(--pri);border-color:var(--pri);color:#fff}
.all{width:100%;border:1.5px solid #222;background:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
.mic{background:#f6f4f2;border-radius:18px;padding:24px;text-align:center;margin-top:14px}
.mic button{width:96px;height:96px;border-radius:50%;border:0;background:var(--pri);font-size:38px;cursor:pointer;color:#fff}
.mic button.rec{animation:pulse 1s infinite;background:#d32f2f}
@keyframes pulse{50%{transform:scale(1.07)}}
.mic p{margin:14px 0 0;color:#555;font-weight:600}
.mic audio{width:100%;margin-top:12px}
.foot{text-align:center;color:var(--sub);padding:6px 0 80px;font-size:14px}
#tip{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;display:none;z-index:9;max-width:90%;text-align:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-top:10px}
.w.sel{background:#ffd9c9;box-shadow:0 0 0 2px #ffd9c9;border-radius:4px}
.rbtn{width:100%;border:1.5px dashed #bbb;background:#fff;border-radius:12px;padding:11px;font-size:14px;font-weight:700;color:#555;cursor:pointer;margin-top:10px}
.rbtn.on{border:1.5px solid var(--pri);background:#fff3ee;color:var(--pri)}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:16px 18px calc(16px + env(safe-area-inset-bottom));z-index:8;display:none}
#sheet .sh-top{display:flex;align-items:center;gap:8px}
#sheet .sh-top b{flex:1;font-size:17px;line-height:1.4;overflow-wrap:anywhere}
#sheet .gr{max-height:60vh;overflow-y:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
#sheet .gr h4{font-size:14px;margin:14px 0 6px;color:#c2410c}
#sheet .gr .gp{background:#f8f6f3;border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:14px;line-height:1.55}
#sheet .gr .gp b{color:#222}#sheet .gr .gp i{font-style:normal;color:#c2410c;font-size:12px;margin-left:6px}
#sheet .sh-x{border:0;background:#f3f1ef;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:14px}
#sheet .sh-ko{font-size:19px;font-weight:700;margin-top:10px;line-height:1.5}
#sheet .sh-note{font-size:14px;color:#555;margin-top:8px;line-height:1.55;background:#f8f6f3;border-radius:10px;padding:10px 12px}
.ai-box{border-top:1px solid var(--line);margin-top:24px;padding-top:4px}
.fw{overflow-wrap:anywhere;line-height:1.25}
.bk{display:flex;gap:8px;margin-top:24px}
.bk .btn{flex:1;padding:11px;font-size:13px}
.stat{display:flex;gap:8px;margin-bottom:12px}
.stat>div{flex:1;background:#fff6f2;border-radius:16px;padding:12px 14px}
.stat small{display:block;color:var(--sub);font-size:12px;font-weight:700}
.stat b{font-size:26px;color:var(--pri);line-height:1.3}
.stat b span{font-size:14px;color:#555;margin-left:2px}
.wk{display:flex;gap:4px;margin-top:6px}
.wk i{flex:1;height:6px;border-radius:3px;background:#eadfd8}
.wk i.on{background:var(--pri)}
.mw{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;line-height:1.25;cursor:pointer}
.mw .gl{font-size:11px;font-weight:700;color:#c2410c;white-space:nowrap;max-width:8em;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.mw .mwt{background:#fff0c2;border-radius:4px;padding:0 1px}
.mw.kn .gl{color:#2a8a4a}.mw.kn .mwt{background:#e6f6ec}
.s.flash{background:#fff3c4;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px;transition:background .3s}
.mine-row{display:flex;gap:8px;margin-top:10px}
.mine-row button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700;color:#555;cursor:pointer}
.mine-row button.on{background:#fff3ee;color:var(--pri);border-color:var(--pri)}
.vname{font-size:12px;color:var(--sub);margin:-4px 0 6px}
.nitem b{font-size:15px;line-height:1.35}
.nko{display:block;font-size:13px;color:#444;margin:2px 0 4px;font-weight:600}
.nhead{background:#faf7f4;border-radius:14px;padding:12px 14px;margin-top:10px}
.nsum{font-size:13px;color:#555;line-height:1.55;margin-top:6px}
.nmeta{font-size:12px;color:var(--sub);margin-top:6px}
.nmeta a{color:var(--pri);font-weight:700;text-decoration:none}
select.t{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header><div style="display:flex;align-items:center;gap:6px"><button class="back" id="back" style="display:none">← 목록</button><button class="back" id="vbtn" style="display:none">📒 단어장</button><button class="back" id="rangeBtn" style="display:none">✂ 구간 해석</button><span class="logo" id="hTitle">Daily News English</span></div><button class="sync" id="syncBtn">☁ …</button></header>
  <main id="app"></main>
</div>
<div id="tip"></div>
<div id="sheet"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PER = 5; // 세트당 문장 수
const KEY = 'dne_lessons_v1', DKEY = 'dne_dict_v1';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
const DELKEY = 'dne_del_v1';
const VKEY = 'dne_vocab_v1';
let lessons = load(KEY, []), dict = load(DKEY, {}), deleted = load(DELKEY, []), vocab = load(VKEY, []);
const guess = { owner: 'lifekoo112233-cmyk', repo: 'study-english-go' };
if (location.hostname.endsWith('.github.io')) {
  guess.owner = location.hostname.split('.')[0];
  const p = location.pathname.split('/')[1]; if (p && !p.includes('.')) guess.repo = p;
}
const cfg = Object.assign({ owner: '', repo: '', branch: 'main', token: '' }, guess, load('dne_cfg', {}));
let quotaWarned = false;
const saveLocal = () => {
  try { localStorage.setItem(KEY, JSON.stringify(lessons)); localStorage.setItem(DELKEY, JSON.stringify(deleted)); localStorage.setItem(VKEY, JSON.stringify(vocab)); }
  catch { if (!quotaWarned) { quotaWarned = true; try { tip('이 기기의 저장 공간이 가득 찼어요. GitHub에는 저장되지만, 오래된 학습을 삭제해 주세요.'); } catch {} } }
};
const save = () => { saveLocal(); queueSync(); };
const saveDict = () => {
  try { const ks = Object.keys(dict); if (ks.length > 3000) ks.slice(0, ks.length - 3000).forEach(k => delete dict[k]); localStorage.setItem(DKEY, JSON.stringify(dict)); } catch {}
};
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

let view = 'home', cur = null, setI = 0, rate = 1, alwaysKo = false;
let add = { title: '', date: today(), text: '', rows: null, enN: 0, koN: 0 };
let playToken = 0, playingKey = null, voices = [];
let allRep = 0, allLoop = false;
let resume = null; // 이어듣기 위치 {kind:'set'|'loop'|'all', lid, i, ...} — 재생이 중간에 멈췄을 때 사용
let hMode = false, hSel = null; // 메인 목록의 '구간 반복' 모드 / 선택한 목록 구간 {a,b}
let abMode = false, abSel = null; // 학습 화면의 '구간 반복' 모드 / 선택한 줄 구간 {a,b}
let allPlay = false, allIdx = 0, allN = 0; // 메인 '전체 듣기'(모든 학습 연속 재생) 상태
let repS = 1, repAll = 1, playing = false; // repAll 0 = 무한 반복
let keepAwake = localStorage.getItem('dne_wake') !== '0', wakeLock = null;
let vFilter = 'learn', vq = [], vShow = false, installEv = null, vDeck = 'learn';
let vHist = [];
const lsGet = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let vSortL = lsGet('dne_vsortl', 'upd'), vSortC = lsGet('dne_vsortc', 'rand'); // 목록 정렬 / 카드 순서
const V_SORTS = [['upd', '최근 변경순'], ['add', '최근 추가순'], ['old', '오래된순'], ['abc', 'ABC순'], ['hits', '많이 찾은순']];
function vSort(arr, m) {
  const a = arr.slice();
  if (m === 'rand') { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const f = {
    upd: (x, y) => (y.updated || 0) - (x.updated || 0),
    add: (x, y) => (y.added || 0) - (x.added || 0),
    old: (x, y) => (x.added || 0) - (y.added || 0),
    abc: (x, y) => x.k.localeCompare(y.k),
    hits: (x, y) => (y.hits || 1) - (x.hits || 1) || (y.updated || 0) - (x.updated || 0)
  }[m] || (() => 0);
  return a.sort(f);
}
const sortChips = (attr, cur, opts) => opts.map(([v, n]) => `<button class="sp ${v === cur ? 'on' : ''}" style="padding:6px 10px;font-size:12px" data-${attr}="${v}">${n}</button>`).join('');
let vEx = localStorage.getItem('dne_vex') === '1'; // 단어장에 예문을 같이 보여줄지(기본: 안 보여줌)
let rangeMode = false, rangeSel = null, sheetData = null, sheetPhrase = '';
/* ---------- 뉴스읽기 (data/news: 매일 자동 업데이트되는 기사) ---------- */
let homeTab = lsGet('dne_htab', 'mine'), newsIdx = null, newsErr = '', newsBusy = false, newsSrc = '', newsUpd = '';
// 기사는 비공개 저장소(기본: news-data)에 있고, 설정의 GitHub 토큰으로 읽는다. 토큰이 없으면 앱에 들어 있는 샘플만 보여준다.
const newsRepo = () => cfg.newsRepo || 'news-data';
async function newsGet(path, local) {
  if (!local && cfg.token && cfg.owner) {
    const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${newsRepo()}/contents/data/news/${path}?ref=main`, { headers: authH('application/vnd.github.raw+json'), cache: 'no-store' });
    if (r.ok) { newsSrc = 'repo'; return r.json(); }
    if (r.status !== 404) throw new Error(r.status === 401 || r.status === 403 ? `토큰에 '${newsRepo()}' 저장소 읽기 권한이 없어요 (⚙ 설정 아래 안내 참고)` : 'GitHub 오류 ' + r.status);
    if (path !== 'index.json') throw new Error('기사 파일이 없어요');
    newsErr = `'${newsRepo()}' 저장소에 아직 기사가 없어서 샘플을 보여드려요`;
  }
  const r = await fetch('data/news/' + path, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status);
  newsSrc = 'sample'; return r.json();
}
async function loadNews(force) {
  if (newsBusy || (newsIdx && !force)) return;
  newsBusy = true; newsErr = '';
  try { const j = await newsGet('index.json'); newsIdx = j.articles || []; newsUpd = j.updated || ''; }
  catch (e) { newsErr = navigator.onLine === false ? '오프라인이에요' : (e.message || '기사 목록을 불러오지 못했어요'); newsIdx = null; }
  newsBusy = false; if (view === 'home' && homeTab === 'news') render();
}
async function openNews(file) {
  tip('기사 불러오는 중…');
  try {
    const a = await newsGet(file, newsSrc === 'sample');
    cur = Object.assign({ created: 0, updated: 0 }, a, { news: true, file }); setI = 0; $('#tip').style.display = 'none'; go('study');
  } catch { tip('기사를 불러오지 못했어요'); }
}
function newsListHtml() {
  if (!newsIdx) { loadNews(); return `<div class="empty">${newsErr ? esc(newsErr) + '<br><button class="btn gray" id="newsRe" style="margin-top:10px">다시 시도</button>' : '기사 목록 불러오는 중…'}</div>`; }
  const list = [...newsIdx].sort((a, b) => b.date.localeCompare(a.date));

/* ---------- 번역 (MyMemory 무료 API) ---------- */
async function tr(text, cache = true) {
  const k = text.toLowerCase();
  if (cache && dict[k]) return dict[k];
  const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|ko');
  const j = await r.json();
  const t = j.responseData && j.responseData.translatedText;
  if (!t || j.responseStatus != 200 || /MYMEMORY WARNING/i.test(t)) throw new Error('fail');
  if (cache) { dict[k] = t; saveDict(); }
  return t;
}
async function trLong(text) {
  if (text.length <= 450) return tr(text, false);
  const parts = []; let c = '';
  text.split(' ').forEach(w => { if ((c + ' ' + w).length > 450) { parts.push(c); c = w; } else c = c ? c + ' ' + w : w; });
  parts.push(c);
  const out = []; for (const p of parts) out.push(await tr(p, false));
  return out.join(' ');
}

const hasKo = s => /[가-힣]/.test(s);
function splitSentences(text) {
  const out = [];
  text.replace(/\r/g, '').split(/\n+/).forEach(line => {
    let t = line.trim(); if (!t) return;
    t = t.replace(/\b(Mr|Mrs|Ms|Dr|St|vs|No)\./g, '$1\u0002').replace(/U\.S\./g, 'U\u0002S\u0002').replace(/U\.K\./g, 'U\u0002K\u0002');
    t = t.replace(/([.!?。]["'”’)\]]*)\s+/g, '$1\u0001');
    t.split('\u0001').forEach(s => { s = s.replace(/\u0002/g, '.').trim(); if (s) out.push(s); });
  });
  return out;
}
function analyze() {
  // 번호(1, 2…)나 ▶ 같은 기호만 있는 줄은 버린다
  const lines = add.text.replace(/\r/g, '').split('\n').map(s => s.trim())
    .filter(s => s && !/^[\d\s.)\-▶►▷▸⏵▶️\uFE0F]+$/.test(s));
  // 영어 한 줄 ↔ 한글 한 줄이 번갈아 나오면 줄 단위로 그대로 짝짓는다
  const alternating = lines.length >= 2 && lines.length % 2 === 0 &&
    lines.every((l, i) => i % 2 === 0 || hasKo(l) !== hasKo(lines[i - 1]));
  if (alternating) {
    add.rows = [];
    for (let i = 0; i < lines.length; i += 2) {
      const a = lines[i], b = lines[i + 1];
      add.rows.push(hasKo(a) ? { en: b, ko: a } : { en: a, ko: b });
    }
    add.enN = add.koN = add.rows.length;
    return;
  }
  // 그 외에는 문장 단위로 나눠서 영어/한글을 따로 모은 뒤 순서대로 짝짓는다
  const sents = splitSentences(lines.join('\n'));
  const en = sents.filter(s => !hasKo(s)), ko = sents.filter(hasKo);
  const n = Math.max(en.length, ko.length);
  add.enN = en.length; add.koN = ko.length;
  add.rows = Array.from({ length: n }, (_, i) => ({ en: en[i] || '', ko: ko[i] || '' }));
}

const nt = s => String(s).toLowerCase().replace(/[’]/g, "'").replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, '').replace(/'s$/, '');
function wordForms(k) { // 단어장에 protest로 저장했으면 protests/protested/protesting도 찾아줌
  const bases = [k];
  if (/ies$|ied$/.test(k) && k.length > 4) bases.push(k.slice(0, -3) + 'y');
  if (/ing$/.test(k) && k.length > 5) bases.push(k.slice(0, -3), k.slice(0, -3) + 'e');
  if (/ed$/.test(k) && k.length > 4) bases.push(k.slice(0, -2), k.slice(0, -1));
  const out = new Set();
  bases.filter(b => b.length >= 3).forEach(b => {
    [b, b + 's', b + 'es', b + 'ed', b + 'd', b + 'ing', b.replace(/e$/, '') + 'ing'].forEach(f => out.add(f));
    if (/[^aeiou]y$/.test(b)) { out.add(b.slice(0, -1) + 'ies'); out.add(b.slice(0, -1) + 'ied'); }
  });
  return out;
}
function mineIndex() {
  const single = new Map(), phrases = [], all = vActive();
  all.forEach(v => { const toks = v.k.split(/\s+/).map(nt).filter(Boolean); if (toks.length > 1) phrases.push({ toks, v }); else if (toks[0]) single.set(toks[0], v); });
  all.forEach(v => { const k = nt(v.k); if (!k || /\s/.test(v.k.trim())) return; wordForms(k).forEach(f => { if (!single.has(f)) single.set(f, v); }); });
  phrases.sort((a, b) => b.toks.length - a.toks.length);

}
function matchSentence(en, idx) {
  const tk = wTokens(en).map(nt), n = tk.length, cov = new Array(n).fill(false), groups = [];
  idx.phrases.forEach(({ toks, v }) => {
    for (let i = 0; i + toks.length <= n; i++) {
      let ok = true;
      for (let j = 0; j < toks.length; j++) if (cov[i + j] || tk[i + j] !== toks[j]) { ok = false; break; }
      if (ok) { groups.push({ a: i, b: i + toks.length - 1, v }); for (let j = 0; j < toks.length; j++) cov[i + j] = true; }
    }
  });
  tk.forEach((t, i) => { if (!cov[i] && t && idx.single.has(t)) groups.push({ a: i, b: i, v: idx.single.get(t) }); });
  return groups.sort((x, y) => x.a - y.a);
}
const gloss = ko => { const g = String(ko || '').split(/[,;/·]/)[0].trim(); return g.length > 8 ? g.slice(0, 8) + '…' : g; };
function enHtml(t, groups) {
  const gs = new Map(); (groups || []).forEach(g => gs.set(g.a, g));
  let n = 0, end = -1;
  return t.split(/(\s+)/).map(p => {
    if (!p.trim()) return p;
    const i = n++; // 구간 선택에 쓰는 단어 번호 (공백 기준, 구두점만 있는 덩어리도 번호를 가짐)
    const w = p.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
    let h = w ? `<span class="w" data-w="${esc(w)}" data-wi="${i}">${esc(p)}</span>` : esc(p);
    const g = gs.get(i);
    if (g) { h = `<span class="mw${g.v.known ? ' kn' : ''}" data-vk="${esc(g.v.k)}"><small class="gl">${esc(gloss(g.v.ko))}</small><span class="mwt">` + h; end = g.b; }
    if (i === end) { h += '</span></span>'; end = -1; }
    return h;
  }).join('');
}
// 이 학습에 나오는 내 단어 목록: [{v, si}] (si = 처음 나오는 문장 번호, 없으면 -1)
function mineList(idx) {
  idx = idx || mineIndex();
  const seen = new Map();
  curSet().forEach((s, si) => matchSentence(s.en, idx).forEach(g => { if (!seen.has(g.v.k)) seen.set(g.v.k, { v: g.v, si }); }));
  vActive().forEach(v => { if (v.lid === cur.id && !seen.has(v.k)) seen.set(v.k, { v, si: -1 }); });
  return [...seen.values()].sort((a, b) => (a.si < 0 ? 1e9 : a.si) - (b.si < 0 ? 1e9 : b.si));
}

let tipTimer;
function tip(t) { const el = $('#tip'); el.textContent = t; el.style.display = 'block'; clearTimeout(tipTimer); tipTimer = setTimeout(() => el.style.display = 'none', 4000); }
/* ---------- AI 번역 (OpenAI, 선택) ---------- */
// 키는 이 기기의 localStorage('dne_ai')에만 저장하고, GitHub 동기화에는 절대 포함하지 않는다.
const AIKEY = 'dne_ai';
const aiCfg = () => Object.assign({ on: false, key: '', model: 'gpt-4o-mini' }, load(AIKEY, {}));
const aiReady = () => { const a = aiCfg(); return !!(a.on && a.key); };
async function aiAsk(system, user) {
  const a = aiCfg();
  const body = { model: a.model || 'gpt-4o-mini', response_format: { type: 'json_object' }, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] };
  if (/^(gpt-5|o\d)/i.test(body.model)) body.reasoning_effort = 'minimal'; // 생각 토큰을 줄여 비용 절약
  const call = () => fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + a.key }, body: JSON.stringify(body) });
  const net = () => new Error('인터넷 연결을 확인하세요.');
  let r;
  try { r = await call(); } catch { throw net(); }
  if (r.status === 400 && body.reasoning_effort) { delete body.reasoning_effort; try { r = await call(); } catch { throw net(); } }
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).error.message || ''; } catch {}
    throw new Error(r.status === 401 ? 'AI 키가 올바르지 않아요.' : r.status === 429 ? '사용 한도를 넘었거나 요청이 너무 많아요.' : r.status === 404 ? '모델 이름을 확인하세요. (' + body.model + ')' : 'AI 오류 (' + r.status + ') ' + m.slice(0, 80));
  }
  const j = await r.json();
  try { return JSON.parse(j.choices[0].message.content); } catch { throw new Error('AI 답변을 읽을 수 없어요.'); }
}
const SYS_ALTS = '너는 영어 학습 앱의 사전이다. 영어 문장과 그 안의 단어(또는 숙어)가 주어진다. 이 단어가 가질 수 있는 한국어 뜻 후보를 4~6개 준다. 이 문장에서 맞을 가능성이 높은 순서로 정렬하고, current(지금 보여준 뜻)와 같은 뜻은 빼라. 각 뜻은 짧게(10자 이내), 서로 겹치지 않게. JSON만 출력: {"options":[{"ko":"뜻","pos":"품사"}]}';
const aiAlts = (word, sentence, current) => aiAsk(SYS_ALTS, JSON.stringify({ sentence, word, current }));
async function trAlts(w) { // AI가 없을 때: 무료 번역의 후보 목록
  const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(w) + '&langpair=en|ko');
  const j = await r.json();
  return [j.responseData && j.responseData.translatedText, ...(j.matches || []).map(m => m.translation)]
    .filter(t => t && /[가-힣]/.test(t) && !/MYMEMORY/i.test(t)).map(t => t.trim()).filter(t => t.length <= 20);
}
let lastTap = null, tapPending = Promise.resolve(); // 두 번 탁탁 감지용
// 단어(또는 숙어)를 두 번 누르면 다른 뜻으로 바꾼다. 후보는 한 번만 받아 두고 누를 때마다 다음 뜻으로 돌아간다.
async function altMeaning(k, si, k2) {
  await tapPending;
  const v = vocab.find(x => x.k === k && !x.del) || (k2 && vocab.find(x => x.k === k2 && !x.del));
  if (!v) { tip('뜻을 먼저 찾은 뒤에 두 번 눌러 주세요'); return; }
  const sent = cur && cur.sentences[si];
  if (!v.alts || !v.alts.length) {
    tip(v.w + ' : 다른 뜻 찾는 중…');
    let list = [];
    try {
      if (aiReady() && sent) list = ((await aiAlts(v.w, sent.en, v.ko)).options || []).map(o => String(o.ko || '').trim());
      else list = await trAlts(v.w);
    } catch (e) { tip(v.w + ' : ' + e.message); return; }
    const seen = new Set(), all = [];
    [v.ko, ...list].forEach(t => { const n = String(t || '').replace(/\s+/g, ' ').trim(); if (n && !seen.has(n)) { seen.add(n); all.push(n); } });
    if (all.length < 2) { tip(v.w + ' : 다른 뜻을 찾지 못했어요'); return; }
    v.alts = all.slice(0, 7); v.altI = 0;
  }
  const i = v.alts.indexOf(v.ko), next = (i < 0 ? 0 : i + 1) % v.alts.length;
  v.altI = next; v.ko = v.alts[next]; v.updated = Date.now(); save();
  paintMine();
  tip(`${v.w} : ${v.ko}   (${next + 1}/${v.alts.length} · 두 번 누르면 다음 뜻)`);
}

async function wordTap(w, idx) {
  speakWord(w);
  const k = w.toLowerCase(), sent = cur && cur.sentences[idx];
  const saved = vocab.find(x => x.k === k && !x.del);
  if (saved) { addVocab(w, saved.ko, sent, cur && cur.id); tip(w + ' : ' + saved.ko + '   (단어장에 있어요)'); return; } // 이미 아는 뜻은 AI를 다시 부르지 않음
  let ko = (sent && sent.wd && (sent.wd[k] || sent.wd[w])) || '';
  if (!ko && aiReady() && sent) {
    tip(w + ' : …');
    try { ko = String((await aiWord(w, sent.en)).ko || '').trim(); }
    catch (e) { tip(w + ' : ' + e.message + ' → 무료 번역으로 대신해요'); await new Promise(r => setTimeout(r, 900)); }
  }
  if (!ko) {
    ko = dict[k];
    if (!ko) { tip(w + ' : …'); try { ko = await tr(w); } catch { tip(w + ' : 번역 실패 (인터넷 연결을 확인하세요)'); return; } }
  }
  const added = addVocab(w, ko, sent, cur && cur.id);
  tip(w + ' : ' + ko + (added ? '   ＋단어장' : ''));
  if (added) paintMine();
}

const SYS_GRAMMAR = '너는 한국인 학습자를 위한 영어 문법 선생님이다. 영어 문장 하나가 주어진다. 쉬운 한국어로 자세히 분석한다. JSON만 출력: {"ko":"전체의 자연스러운 한국어 해석","structure":"문장 전체 구조를 한 줄로 요약(예: 주절 + that절, 관계절, 분사구문 등)","parts":[{"en":"문장 조각(원문 그대로, 앞에서부터 순서대로 빠짐없이)","role":"문장 성분/문법 역할(주어, 동사, 목적어, 관계대명사절, 과거분사 수식, to부정사 목적 등)","note":"그 조각의 뜻과 문법 설명 1~2문장"}],"points":[{"title":"핵심 문법 포인트 이름","note":"쉬운 설명(필요하면 짧은 예시) 1~2문장"}],"skeleton":{"en":"수식어를 모두 뺀 핵심 뼈대 문장","ko":"그 해석"}} parts는 3~8개, points는 1~4개.';

const wTokens = t => t.split(/\s+/).filter(Boolean);
function paintRange() {
  document.querySelectorAll('.s').forEach((row, i) => row.querySelectorAll('.w').forEach(sp => {
    const wi = +sp.dataset.wi;
    const on = rangeSel && rangeSel.si === i && wi >= rangeSel.a && wi <= (rangeSel.b == null ? rangeSel.a : rangeSel.b);
    sp.classList.toggle('sel', !!on);
  }));
}
function closeSheet() { sheetData = null; const el = $('#sheet'); if (el) { el.style.display = 'none'; el.innerHTML = ''; } document.body.style.paddingBottom = ''; }
function openSheet(html) { const el = $('#sheet'); el.innerHTML = html; el.style.display = 'block'; document.body.style.paddingBottom = (el.offsetHeight + 16) + 'px'; }
const sheetHead = ph => `<div class="sh-top"><b>${esc(ph)}</b><button class="pb" style="width:34px;height:34px" data-psp>▶</button><button class="sh-x" data-pclose>✕</button></div>`;
function renderSheetResult() {
  const d = sheetData; if (!d) return;
  const saved = vocab.some(v => v.k === d.phrase.toLowerCase() && !v.del);
  openSheet(sheetHead(d.phrase) + `<div class="sh-ko">${esc(d.ko)}${d.idiom ? ' <small style="color:var(--pri)">숙어/표현</small>' : ''}</div>${d.note ? `<div class="sh-note">💡 ${esc(d.note)}</div>` : ''}
    <div class="two"><button class="btn ${saved ? 'gray' : ''}" data-psave ${saved ? 'disabled' : ''}>${saved ? '✓ 단어장에 저장됨' : '📒 단어장에 저장'}</button></div>`);
}
function rangePick(si, wi) {
  if (!rangeSel || rangeSel.si !== si || rangeSel.b != null) {
    rangeSel = { si, a: wi, b: null }; paintRange(); closeSheet();
    tip('끝 단어를 누르세요 (한 단어만이면 같은 단어를 한 번 더)'); return;
  }
  rangeSel = { si, a: Math.min(rangeSel.a, wi), b: Math.max(rangeSel.a, wi) };
  paintRange(); phraseAsk();
}
async function phraseAsk() {
  const my = rangeSel, sent = curSet()[my.si]; if (!sent) return;
  const phrase = wTokens(sent.en).slice(my.a, my.b + 1).join(' ').replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
  sheetPhrase = phrase;
  if (!phrase) { closeSheet(); return; }
  if (!aiReady()) {
    openSheet(sheetHead(phrase) + '<div class="sh-note">구간 해석은 AI 번역이 필요해요. ⚙ 설정에서 OpenAI 키를 입력하고 켜 주세요.</div><div class="two"><button class="btn" data-pset>⚙ 설정 열기</button></div>');

/* ---------- GitHub 동기화 (월별 파일로 나눠 저장) ---------- */
// data/lessons/YYYY-MM.json : 그 달의 학습      data/vocab/YYYY-MM.json : 그 달에 추가한 단어
// data/deleted.json         : 삭제한 학습 id     (예전 data/lessons.json 이 있으면 자동으로 옮긴 뒤 지워요)
const SKEY = 'dne_shards_v1';
let shards = load(SKEY, {}); // { 경로: { sha, canon } } — 서버와 마지막으로 일치했던 상태
let syncState = cfg.token ? 'saving' : 'local', lastErr = '', syncing = false, again = false, qTimer;
const saveShards = () => { try { localStorage.setItem(SKEY, JSON.stringify(shards)); } catch {} };
const mkey = d => String(d || '').slice(0, 7) || 'unknown';
const mkeyTs = t => { try { return new Date(t || 0).toISOString().slice(0, 7); } catch { return 'unknown'; } };
const apiBase = () => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/`;
const authH = accept => ({ Authorization: 'Bearer ' + cfg.token, Accept: accept || 'application/vnd.github+json' });
function b64(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const canonItems = (arr, idKey = 'id') => arr.map(x => x[idKey] + ':' + (x.updated || x.created || 0)).sort().join('|');
const canonIds = arr => [...new Set(arr)].sort().join('|');

function mergeLessons(list, del) {
  const dset = new Set([...deleted, ...(del || [])]); deleted = [...dset];
  const map = new Map();
  [...lessons, ...(list || [])].forEach(l => {
    if (dset.has(l.id)) return;
    const o = map.get(l.id);
    if (!o || (l.updated || l.created || 0) > (o.updated || o.created || 0)) map.set(l.id, l);
  });
  lessons = [...map.values()];
}
function mergeVocab(list) {
  const vm = new Map();
  [...vocab, ...(list || [])].forEach(v => { const o = vm.get(v.k); if (!o || (v.updated || 0) > (o.updated || 0)) vm.set(v.k, v); });
  vocab = [...vm.values()];
}
function localGroups() {
  const g = {};
  lessons.forEach(l => { const p = 'data/lessons/' + mkey(l.date) + '.json'; if (!g[p]) g[p] = { kind: 'l', items: [] }; g[p].items.push(l); });
  vocab.forEach(v => { const p = 'data/vocab/' + mkeyTs(v.added) + '.json'; if (!g[p]) g[p] = { kind: 'v', items: [] }; g[p].items.push(v); });
  return g;
}

const fail = (r, what) => new Error(
  r.status === 401 ? '토큰이 올바르지 않아요.' :
  r.status === 404 && what === '저장' ? '저장소를 찾을 수 없어요. 사용자명과 저장소 이름, 토큰이 이 저장소를 선택했는지 확인하세요.' :
  r.status === 403 ? '권한이 없거나 요청이 너무 많아요. 토큰의 Contents 권한이 "Read and write"인지 확인하세요. (' + what + ')' :
  what + ' 실패 (' + r.status + ')');
async function listDir(dir) {
  const r = await fetch(apiBase() + dir + `?ref=${cfg.branch}&t=${Date.now()}`, { headers: authH(), cache: 'no-store' });
  if (r.status === 404) return [];
  if (!r.ok) throw fail(r, '목록 불러오기');
  const j = await r.json();
  return Array.isArray(j) ? j.filter(f => f.type === 'file' && f.name.endsWith('.json')) : [];
}
async function getRaw(path) { // 1MB가 넘는 파일도 읽을 수 있도록 raw 방식으로 받는다
  const r = await fetch(apiBase() + path + `?ref=${cfg.branch}&t=${Date.now()}`, { headers: authH('application/vnd.github.raw+json'), cache: 'no-store' });
  if (!r.ok) throw fail(r, '파일 불러오기');
  return JSON.parse(await r.text());
}
async function putFile(path, obj, sha) {
  const body = { message: 'sync ' + new Date().toISOString().slice(0, 16), content: b64(JSON.stringify(obj)), branch: cfg.branch };
  if (sha) body.sha = sha;
  const r = await fetch(apiBase() + path, { method: 'PUT', headers: { ...authH(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) { const e = new Error('충돌'); e.conflict = true; throw e; }
  if (!r.ok) throw fail(r, '저장');
  return (await r.json()).content.sha;
}
async function syncOnce() {
  const [top, ls, vs] = await Promise.all([listDir('data'), listDir('data/lessons'), listDir('data/vocab')]);
  const remote = {};
  ls.forEach(f => { remote['data/lessons/' + f.name] = f.sha; });
  vs.forEach(f => { remote['data/vocab/' + f.name] = f.sha; });
  const delF = top.find(f => f.name === 'deleted.json');
  const stF = top.find(f => f.name === 'stats.json');
  if (stF && !(shards['data/stats.json'] && shards['data/stats.json'].sha === stF.sha)) {
    const j = await getRaw('data/stats.json');
    mergeStats(j.stats || {});
    shards['data/stats.json'] = { sha: stF.sha, canon: canonStats(j.stats || {}) }; // 합친 결과가 서버와 다르면 아래에서 다시 올림
  }
  const legF = top.find(f => f.name === 'lessons.json');

  // 1) 서버에서 바뀐 것만 내려받아 합치기 (삭제 기록 → 학습 → 단어 순서)
  if (delF && !(shards['data/deleted.json'] && shards['data/deleted.json'].sha === delF.sha)) {
    const j = await getRaw('data/deleted.json');
    mergeLessons([], j.deleted || []);
    shards['data/deleted.json'] = { sha: delF.sha, canon: canonIds(j.deleted || []) };
  }
  for (const path of Object.keys(remote)) {
    if (shards[path] && shards[path].sha === remote[path]) continue; // 이미 합쳐 둔 상태
    const j = await getRaw(path);
    if (path.startsWith('data/lessons/')) { mergeLessons(j.lessons || [], []); shards[path] = { sha: remote[path], canon: canonItems(j.lessons || []) }; }
    else { mergeVocab(j.vocab || []); shards[path] = { sha: remote[path], canon: canonItems(j.vocab || [], 'k') }; }
  }
  if (legF) { // 예전 방식(파일 하나)으로 저장된 내용이 있으면 합친다
    const j = await getRaw('data/lessons.json');
    mergeLessons(j.lessons || [], j.deleted || []); mergeVocab(j.vocab || []);
  }
  saveLocal();

  // 2) 서버와 다른 달만 올리기
  for (const [path, g] of Object.entries(localGroups())) {
    const c = canonItems(g.items, g.kind === 'l' ? 'id' : 'k');
    const known = shards[path];
    if (known && known.canon === c) continue;
    const sha = await putFile(path, g.kind === 'l' ? { lessons: g.items } : { vocab: g.items }, known ? known.sha : null);
    shards[path] = { sha, canon: c }; saveShards();
  }
  const dc = canonIds(deleted), dk = shards['data/deleted.json'];
  if (deleted.length && (!dk || dk.canon !== dc)) {
    const sha = await putFile('data/deleted.json', { deleted }, dk ? dk.sha : null);
    shards['data/deleted.json'] = { sha, canon: dc };
  }
  const sc = canonStats(), sk = shards['data/stats.json'];
  if (Object.keys(stats).length && (!sk || sk.canon !== sc)) {
    const sha = await putFile('data/stats.json', { stats }, sk ? sk.sha : null);
    shards['data/stats.json'] = { sha, canon: sc };
  }
  statsDirty = false;
  // 3) 옮기기가 끝났으니 예전 파일 삭제 (실패해도 무시)
  if (legF) {
    try {
      await fetch(apiBase() + 'data/lessons.json', { method: 'DELETE', headers: { ...authH(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'migrate to monthly files', sha: legF.sha, branch: cfg.branch }) });
    } catch {}
  }
  saveShards();
}
async function syncNow() {
  if (!cfg.token) { setStatus('local'); return; }
  if (syncing) { again = true; return; }
  syncing = true; setStatus('saving');
  try {
    let tries = 0;
    do {
      again = false;
      try { await syncOnce(); }
      catch (e) { if (e.conflict && tries++ < 2) { shards = {}; saveShards(); again = true; continue; } throw e; }
    } while (again);
    setStatus('ok');
  } catch (e) {
    lastErr = navigator.onLine === false ? '오프라인이에요. 인터넷에 연결되면 자동으로 동기화돼요.' : (e.message || String(e));
    setStatus('err');
  }
  syncing = false;
  if (cur) cur = lessons.find(l => l.id === cur.id) || cur;
  if (view === 'home') render();
}
function queueSync() { if (!cfg.token) { setStatus('local'); return; } clearTimeout(qTimer); qTimer = setTimeout(syncNow, 800); }

  b.textContent = m[syncState]; b.className = 'sync ' + (syncState === 'ok' ? 'ok' : syncState === 'err' ? 'err' : '');

    <label class="l">사용자명</label><input class="t" id="cfgOwner" value="${esc(cfg.owner)}">
    <label class="l">저장소 이름</label><input class="t" id="cfgRepo" value="${esc(cfg.repo)}">
    <label class="l">브랜치</label><input class="t" id="cfgBranch" value="${esc(cfg.branch)}">
    <label class="l">📰 뉴스 저장소 (비공개)</label><input class="t" id="cfgNews" value="${esc(newsRepo())}">
    <button class="btn full" id="cfgSave" style="margin-top:16px">저장하고 동기화</button>
    <p class="hint">토큰 만드는 법: GitHub 프로필 → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token → 이 저장소만 선택 → Repository permissions의 <b>Contents</b>를 <b>Read and write</b>로.<br>📰 뉴스읽기를 쓰려면 같은 토큰의 저장소 목록에 <b>뉴스 저장소</b>도 추가하세요(읽기만 있으면 돼요).</p>
    ${cfg.token ? '<button class="btn gray full" id="cfgClear" style="margin-top:8px">이 기기에서 토큰 지우기</button>' : ''}
    ${voiceSelectHtml()}
    ${ttsCompareHtml()}
    ${aiSettingsHtml()}
  </div>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'aTitle') add.title = t.value;
  else if (t.id === 'aDate') add.date = t.value;
  else if (t.id === 'aText') add.text = t.value;
  else if (t.id === 'cmpText') cmpText = t.value;
  else if (t.dataset && t.dataset.r !== undefined) add.rows[+t.dataset.r][t.dataset.f] = t.value;
});
function voicePreview(force) {
  if (playing && !force) { tip('다음 문장부터 바뀐 음성으로 읽어요'); return; } // 재생 중이면 끊지 않음
  stopAll(); paintPlaying();
  if (ttsOn() && !force) { setTimeout(() => speakSent('Hello, this is the ' + (voiceCfg.sex === 'm' ? 'male' : 'female') + ' AI voice for your daily news.', rate, { upload: false }), 60); return; }
  setTimeout(() => speak(voiceCfg.acc === 'gb' ? 'Hello, this is the British English voice.' : 'Hello, this is the American English voice.', rate), 60);
  if (voiceNote) tip(voiceNote);
}
// 잠금화면·이어폰 버튼으로 멈추기/다시 듣기
if ('mediaSession' in navigator) {
  const ms = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
  ms('pause', () => { stopAll(); paintPlaying(); });
  ms('stop', () => { stopAll(); paintPlaying(); });
  ms('play', () => { const b = $('#resumeBtn') || $('#playAll'); if (b) b.click(); });
}
document.addEventListener('change', e => {
  if (e.target.id === 'voiceSel') { voiceCfg.name = e.target.value; saveVoiceCfg(); voicePreview(true); }
});
document.addEventListener('click', e => {
  const t = e.target, c = sel => t.closest(sel);
  unlockAudio();
  if (t.id === 'back') return go('home');
  if (c('[data-htab]')) { homeTab = c('[data-htab]').dataset.htab; lsSet('dne_htab', homeTab); stopAll(); hMode = false; hSel = null; render(); return; }
  if (t.id === 'newsRe') { newsIdx = null; loadNews(true); render(); return; }
  if (c('[data-nopen]')) return openNews(c('[data-nopen]').dataset.nopen);
  if (t.id === 'newsSave') return newsSave();
  if (view === 'home' && hMode && c('.item')) { hPick([...document.querySelectorAll('.item')].indexOf(c('.item'))); return; }
  if (view === 'study' && abMode && c('.s') && !c('.btns')) { abPick([...document.querySelectorAll('.s')].indexOf(c('.s'))); return; }
  if (t.id === 'playAllLessons') return playAllLessons();
  if (c('#hSleep')) return setSleep(sleepEnd ? 0 : 30);
  if (c('[data-sleep]')) return setSleep(+c('[data-sleep]').dataset.sleep);
  if (c('[data-vacc]')) { voiceCfg.acc = c('[data-vacc]').dataset.vacc; voiceCfg.name = ''; saveVoiceCfg(); render(); voicePreview(); return; }
  if (c('[data-vsex]')) { voiceCfg.sex = c('[data-vsex]').dataset.vsex; voiceCfg.name = ''; saveVoiceCfg(); render(); voicePreview(); return; }
  if (t.id === 'voiceTest') return voicePreview(true);
  if (c('[data-ttsv]')) { voiceCfg.sex = c('[data-ttsv]').dataset.ttsv === 'cedar' ? 'm' : 'f'; saveVoiceCfg(); $('#ttsVRow').innerHTML = ttsChips(); return cmpPlayAi(); }
  if (c('[data-vmode]')) {
    voiceCfg.ai = c('[data-vmode]').dataset.vmode === 'ai'; saveVoiceCfg(); ttsWarned = false; render();
    if (voiceCfg.ai && !aiCfg().key) tip('AI 음성은 ⚙ 설정에서 OpenAI 키를 넣어야 써요'); else voicePreview();
    return;
  }
  if (t.id === 'lvSwitch') {
    const v = ttsVoice(), st = ttsCfg.style;
    if (!confirm(`이 학습을 ${v === 'cedar' ? '남성' : '여성'}(${v}) 목소리로 바꿀까요?\n들을 때 새로 만들어서 비용이 다시 들어요. (예전 음성은 지우지 않아요)`)) return;
    rememberVoice(cur, v, st); lvGuess.delete(cur.id); render(); tip('이 학습은 이제 ' + v + ' 목소리로 들려줘요'); return;
  }
  if (t.id === 'ttsAiOn') { voiceCfg.ai = t.checked; saveVoiceCfg(); ttsWarned = false; return; }
  if (t.id === 'wordAi') { voiceCfg.wordAi = t.checked; saveVoiceCfg(); return; }
  if (t.id === 'ttsPre') {
    if (bulkRun) { bulkRun = null; t.textContent = '🎙 이 학습 음성 미리 만들기'; tip('음성 만들기를 멈췄어요'); return; }
    const ss = curSet(), my = cur.id;
    missingSentences([cur]).then(miss => {
      if (!miss.length) { tip('이 학습은 이 기기에 음성이 다 있어요 ✓'); return; }
      const won = miss.reduce((n, s) => n + s.en.length, 0) * WON_PER_CHAR;
      tip(`🎙 ${miss.length}문장 음성 만드는 중… (최대 약 ${Math.ceil(won)}원)`);
      const btn = () => (cur && cur.id === my) ? $('#ttsPre') : null;
      if (btn()) btn().textContent = '■ 멈추기';
      makeAudio(miss, '이 학습 음성', (d, n, m, err) => { const b = btn(); if (b) b.textContent = err || d >= n ? '🎙 이 학습 음성 미리 만들기' : `■ 멈추기 ${d}/${n}`; });
    });
    return;
  }
  if (t.id === 'bulkBtn') {
    if (bulkRun) { bulkRun = null; t.textContent = '🎙 모든 학습 음성 한꺼번에 만들기'; return; }
    if (!ttsOn()) { tip('위에서 "문장 읽기에 AI 음성 사용"을 켜고 OpenAI 키를 넣어 주세요'); return; }
    missingSentences(lessons).then(miss => {
      const info = $('#bulkInfo');
      if (!miss.length) { if (info) info.textContent = '이 기기에 모든 학습 음성이 이미 있어요 ✓'; return; }
      const chars = miss.reduce((n, s) => n + s.en.length, 0), won = Math.ceil(chars * WON_PER_CHAR);
      if (!confirm(`이 기기에 음성이 없는 문장 ${miss.length}개 (영어 ${chars.toLocaleString()}글자)\n예상 비용: 최대 약 ${won.toLocaleString()}원\n\n${cfg.token ? 'GitHub에 이미 있는 음성은 내려받기만 해서 실제 비용은 더 적을 수 있어요.\n' : ''}만들까요?`)) return;
      t.textContent = '■ 멈추기';
      makeAudio(miss, '전체 음성', (d, n, m, err) => {
        const b = $('#bulkBtn'), i = $('#bulkInfo');
        if (i) i.textContent = `${d}/${n} 완료 · 새로 만든 것 ${m}개 (약 ${Math.ceil(m * (chars / n) * WON_PER_CHAR)}원)${err ? ' — 오류로 멈췄어요' : ''}`;
        if (b) b.textContent = err || d >= n ? '🎙 모든 학습 음성 한꺼번에 만들기' : `■ 멈추기 (${d}/${n})`;
      });
    });
    return;
  }
  if (c('[data-ttss]')) { ttsCfg.style = c('[data-ttss]').dataset.ttss; saveTtsCfg(); $('#ttsSRow').innerHTML = styleChips(); return cmpPlayAi(); }
  if (t.id === 'cmpAi') return cmpPlayAi();
  if (c('[data-fmt]')) { voiceCfg.fmt = c('[data-fmt]').dataset.fmt; saveVoiceCfg(); $('#fmtRow').innerHTML = fmtChips(); tip(voiceCfg.fmt === 'opus' ? '새로 만드는 음성은 opus로 저장해요' : '새로 만드는 음성은 mp3로 저장해요'); return; }
  if (t.id === 'fmtCmp') return fmtCompare();
  if (t.id === 'cmpDev') return cmpPlayDev();
  if (t.id === 'cmpBoth') { (async () => { await cmpPlayDev(); await wait(700); await cmpPlayAi(); })(); return; }
  if (t.id === 'hAB') { stopAll(); resume = null; hMode = !hMode; hSel = null; render(); if (hMode) tip('시작 목록과 끝 목록을 차례로 누르세요'); return; }
  if (t.id === 'abBtn') {
    stopAll(); resume = null; abMode = !abMode; abSel = null; if (abMode) { rangeMode = false; rangeSel = null; closeSheet(); }
    render(); if (abMode) tip('시작 줄과 끝 줄을 차례로 누르세요'); return;
  }
  if (t.id === 'vbtn') { vFilter = 'learn'; return go('vocab'); }
  if (t.id === 'newBtn') { go('add'); return; }
  if (c('[data-ren]')) {
    const l = lessons.find(x => x.id === c('[data-ren]').dataset.ren); if (!l) return;
    const t = prompt('학습 제목 수정', l.title);
    if (t === null) return;
    const nt = t.trim(); if (!nt || nt === l.title) return;
    l.title = nt; l.updated = Date.now(); save(); render(); return;
  }
  if (c('[data-del]')) {
    const id = c('[data-del]').dataset.del, l = lessons.find(x => x.id === id);
    if (l && confirm(`"${l.title}" 학습을 삭제할까요?`)) { lessons = lessons.filter(x => x.id !== id); deleted.push(id); save(); render(); }
    return;
  }
  if (c('[data-open]')) { cur = lessons.find(x => x.id === c('[data-open]').dataset.open); setI = 0; go('study'); return; }
  if (t.id === 'installBtn' && installEv) { installEv.prompt(); installEv.userChoice.finally(() => { installEv = null; if (view === 'home') render(); }); return; }
  if (c('[data-vopen]')) { vFilter = c('[data-vopen]').dataset.vopen; return go('vocab'); }
  if (t.id === 'vExToggle') { vEx = t.checked; try { localStorage.setItem('dne_vex', vEx ? '1' : '0'); } catch {} render(); return; }
  if (t.id === 'vcards') return startCards();
  if (t.id === 'vlist') { vFilter = vDeck; return go('vocab'); }
  if (c('[data-vf]')) { vFilter = c('[data-vf]').dataset.vf; render(); return; }
  if (c('[data-vsp]')) return vSpeak(c('[data-vsp]').dataset.vsp);
  if (c('[data-vknown]')) return vToggleKnown(c('[data-vknown]').dataset.vknown);
  if (c('[data-vdel]')) return vDelete(c('[data-vdel]').dataset.vdel);
  if (c('[data-vedit]')) return vEdit(c('[data-vedit]').dataset.vedit);
  if (c('#fcard')) {
    if (!vShow) { vShow = true; render(); vSpeakCur(); return; }
    vPush();
    if (vDeck === 'known') vq.shift(); else vq.push(vq.shift()); // 뜻이 보인 상태에서 한 번 더 누르면 다음 단어로
    vShow = false; render(); return;
  }
  if (t.id === 'cardSpeak') return vSpeakCur();
  if (t.id === 'cardBack') return vBack();
  if (c('[data-lsort]')) { vSortL = c('[data-lsort]').dataset.lsort; lsSet('dne_vsortl', vSortL); render(); return; }
  if (c('[data-csort]')) { vSortC = c('[data-csort]').dataset.csort; lsSet('dne_vsortc', vSortC); render(); return; }
  if (t.id === 'cardNo') {
    vPush();
    if (vDeck === 'known') { vUnknown(vq.shift()); tip('외울 단어로 되돌렸어요'); } else vq.push(vq.shift());
    vShow = false; render(); return;
  }
  if (t.id === 'cardYes') {
    vPush();
    if (vDeck === 'learn') { vMarkKnown(vq.shift()); tip('외운 단어로 옮겼어요 ✓ (단어장에서 계속 볼 수 있어요)'); } else vq.shift();
    vShow = false; render(); return;
  }
  if (t.id === 'aiSave' || t.id === 'aiTest') {
    const a = { on: $('#aiOn').checked, key: $('#aiKey').value.trim(), model: $('#aiModel').value.trim() || 'gpt-4o-mini' };
    localStorage.setItem(AIKEY, JSON.stringify(a));
    if (t.id === 'aiSave') { tip(a.on && !a.key ? 'AI 키를 입력해야 켜져요' : 'AI 설정을 저장했어요'); return; }
    if (!a.key) { tip('AI 키를 먼저 입력하세요'); return; }
    tip('연결 테스트 중…');
    aiWord('deficits', 'The country is running deficits north of 5% of GDP.').then(r => tip('연결 성공! deficits : ' + (r.ko || '?'))).catch(e => tip(e.message));
    return;
  }
  if (t.id === 'rangeBtn') {
    if (!rangeMode && !aiReady()) { if (confirm('구간 해석에는 AI 번역 설정이 필요해요. 설정으로 이동할까요?')) go('settings'); return; }
    rangeMode = !rangeMode; rangeSel = null; closeSheet(); if (rangeMode) { abMode = false; abSel = null; stopAll(); } render();
    if (rangeMode) tip('시작 단어와 끝 단어를 차례로 누르세요');
    return;
  }
  if (c('[data-pclose]')) { closeSheet(); rangeSel = null; paintRange(); return; }
  if (c('[data-pset]')) return go('settings');
  if (c('[data-psp]')) { if (sheetPhrase) speakWord(sheetPhrase); return; }
  if (c('[data-psave]')) {
    const d = sheetData; if (!d) return;
    const added = addVocab(d.phrase, d.ko, d.sent, d.lid, { note: d.note });
    tip(added ? d.phrase + ' : 단어장에 저장했어요 ✓' : '이미 단어장에 있어요'); renderSheetResult(); if (added) paintMine(); return;
  }
  if (t.id === 'cfgBtn') return go('settings');
  if (t.id === 'syncBtn') {
    if (!cfg.token) return go('settings');
    if (syncState === 'err' && lastErr) alert(lastErr);
    syncNow(); return;
  }
  if (t.id === 'cfgSave') {
    cfg.token = $('#cfgToken').value.trim(); cfg.owner = $('#cfgOwner').value.trim();
    cfg.repo = $('#cfgRepo').value.trim(); cfg.branch = $('#cfgBranch').value.trim() || 'main';
    cfg.newsRepo = ($('#cfgNews').value.trim() || 'news-data'); newsIdx = null;
    localStorage.setItem('dne_cfg', JSON.stringify(cfg));
    go('home');
    syncNow().then(() => { if (syncState === 'ok') alert('동기화 연결 완료!'); else if (syncState === 'err') alert(lastErr); });
    return;
  }
  if (t.id === 'cfgClear') { cfg.token = ''; localStorage.setItem('dne_cfg', JSON.stringify(cfg)); setStatus('local'); go('home'); return; }
  if (t.id === 'exp') return exportAll();
  if (t.id === 'imp') return $('#impFile').click();
  if (t.id === 'analyze') { if (!add.text.trim()) return alert('원문을 붙여넣어 주세요.'); analyze(); render(); return; }
  if (t.id === 'reedit') { add.rows = null; render(); return; }
  if (c('[data-merge]')) {
    const i = +c('[data-merge]').dataset.merge;
    if (add.rows[i + 1]) { const a = add.rows[i], b = add.rows.splice(i + 1, 1)[0]; a.en = (a.en + ' ' + b.en).trim(); a.ko = (a.ko + ' ' + b.ko).trim(); render(); }
    return;
  }
  if (c('[data-rdel]')) { add.rows.splice(+c('[data-rdel]').dataset.rdel, 1); render(); return; }
  if (t.id === 'saveLesson') return saveLesson();
  if (c('[data-reps]')) { repS = +c('[data-reps]').dataset.reps; render(); return; }
  if (c('[data-repa]')) { repAll = +c('[data-repa]').dataset.repa; render(); return; }
  if (c('[data-play]')) return playOne(+c('[data-play]').dataset.play);
  if (c('[data-ko]')) return showKo(+c('[data-ko]').dataset.ko);
  if (c('[data-grre]')) return grammarOpen(grIdx, true);
  if (c('[data-gr]')) return grammarOpen(+c('[data-gr]').dataset.gr);
  if (c('[data-rate]')) { rate = +c('[data-rate]').dataset.rate; render(); return; }
  if (t.id === 'keepAwake') { keepAwake = t.checked; localStorage.setItem('dne_wake', keepAwake ? '1' : '0'); if (!keepAwake) wakeOff(); else if (playing || playingKey !== null) wakeOn(); return; }
  if (t.id === 'alwaysKo') { alwaysKo = t.checked; render(); return; }
  if (t.id === 'playAll') return playSet();
  if (t.id === 'resumeBtn') {
    const r = resume; if (!r) return;
    if (r.kind === 'set') return playSet(r.i, r.r);
    if (r.kind === 'loop') return playLoop(r.a, r.b, r.i);
    if (r.kind === 'all') return playAllLessons(r.range, { lid: r.lid, i: r.i, r: r.r });
    return;
  }
  if (t.id === 'mineBtn') { showMine = !showMine; lsSet('dne_mine', showMine ? '1' : '0'); paintMine(); t.className = showMine ? 'on' : ''; t.textContent = '📒 내 단어 ' + (showMine ? '표시 ON' : '표시'); return; }
  if (c('#mineList')) return openMineSheet();
  if (c('[data-mdel]')) {
    const v = vocab.find(x => x.k === c('[data-mdel]').dataset.mdel);
    if (v && confirm(`"${v.w}"을(를) 단어장에서 삭제할까요?`)) { v.del = true; v.updated = Date.now(); save(); paintMine(); openMineSheet(); tip(v.w + ' 삭제했어요'); }
    return;
  }
  if (c('[data-mjump]')) return mineJump(+c('[data-mjump]').dataset.mjump);
  if (c('.mw') && !c('.w')) { // 뜻 글자: 한 번 = 전체 뜻, 두 번 = 다른 뜻
    const k = c('.mw').dataset.vk, si = [...document.querySelectorAll('.s')].indexOf(c('.s')), now = Date.now();
    if (lastTap && lastTap.id === 'g:' + k && now - lastTap.t < 450) { lastTap = null; return altMeaning(k, si); }
    lastTap = { id: 'g:' + k, t: now };
    const v = vocab.find(x => x.k === k); if (v) tip(v.w + ' : ' + v.ko + (v.note ? '  💡 ' + v.note : '') + '   (두 번 누르면 다른 뜻)'); return;
  }
  if (c('.w')) {
    const sp = c('.w'), si = [...document.querySelectorAll('.s')].indexOf(sp.closest('.s'));
    if (rangeMode) return rangePick(si, +sp.dataset.wi);
    const id = si + ':' + sp.dataset.wi, now = Date.now();
    if (lastTap && lastTap.id === id && now - lastTap.t < 450) { lastTap = null; return altMeaning(sp.dataset.w.toLowerCase(), si, c('.mw') && c('.mw').dataset.vk); }
    lastTap = { id, t: now };
    return (tapPending = wordTap(sp.dataset.w, si).catch(() => {}));
  }
});

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; if (view === 'home') render(); });
window.addEventListener('appinstalled', () => { installEv = null; if (view === 'home') render(); });
window.addEventListener('online', () => syncNow());
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
syncNow();
if (voiceCfg.ai) loadRemoteAudio();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (view === 'home') syncNow();
  if (playing || playingKey !== null) wakeOn();
});
</script>
</body>
