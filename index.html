<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily News English</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff5722">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뉴스영어">
<style>
:root{--pri:#ff5722;--bg:#faf8f6;--line:#eee;--txt:#1a1a1a;--sub:#888}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5;min-height:56px}
.logo{color:var(--pri);font-weight:800;font-size:20px}
.back{border:0;background:#f3f1ef;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.gray{background:#eee;color:#333}
.btn.full{width:100%}
.sync{border:0;background:#f3f1ef;border-radius:20px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#555;white-space:nowrap}
.sync.ok{color:#2a8a4a}
.sync.err{color:#d32f2f}
.bar{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-top:8px}
.seg{display:flex;gap:6px;margin:14px 0 4px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 6px;font-size:13px;font-weight:700;color:#666;cursor:pointer}
.seg button.on{background:#222;color:#fff;border-color:#222}
.vw{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.vh{display:flex;align-items:center;gap:8px}
.vh b{font-size:19px}
.vh small{color:var(--sub);font-size:12px}
.vko{font-size:16px;margin-top:6px;color:#333;cursor:pointer}
.vex{font-size:13px;color:var(--sub);line-height:1.5;margin-top:6px}
.vex mark{background:#fff0c2;color:inherit;border-radius:3px;padding:0 1px}
.vact{display:flex;gap:8px;margin-top:10px}
.vact button{border:0;border-radius:8px;background:#f3f1ef;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#555}
.vact button.ok{background:#e6f6ec;color:#2a8a4a}
.fcard{border:1px solid var(--line);border-radius:20px;padding:36px 20px;margin-top:14px;text-align:center;min-height:260px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:12px}
.fw{font-size:34px;font-weight:800}
.fko{font-size:22px;color:#333}
.fcard .vex{text-align:left}
.two{display:flex;gap:10px;margin-top:14px}
.two .btn{flex:1}
.pad{padding:16px}
.card{margin:14px;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer}
.item b{display:block;font-size:16px;margin-bottom:4px}
.item small{color:var(--sub);font-size:13px}
.item .x{border:0;background:#f3f1ef;border-radius:8px;padding:6px 10px;color:#999;cursor:pointer;font-size:12px}
.empty{color:var(--sub);text-align:center;padding:40px 10px;line-height:1.6}
label.l{display:block;font-size:13px;color:#666;margin:12px 0 4px}
input.t,textarea.t{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
textarea.t{min-height:220px;resize:vertical;line-height:1.5}
.warn{background:#fff3e0;color:#a35a00;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.5}
.info{background:#eef6ff;color:#245;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.5}
.prow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:#fcfcfc}
.prow textarea{width:100%;border:1px solid #e5e5e5;border-radius:8px;padding:8px;font-size:14px;font-family:inherit;min-height:56px;margin-top:6px}
.prow .no{font-size:12px;color:var(--pri);font-weight:700}
.prow .mini{border:0;background:#eee;border-radius:8px;padding:5px 9px;font-size:12px;margin-left:6px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{background:var(--pri);color:#fff;font-weight:700;border-radius:20px;padding:8px 16px;font-size:14px}
.cnt{color:var(--sub);font-size:15px}
.tabs{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:#222;color:#fff;border-color:#222}
.tabs button.done::after{content:" ✓";color:#2bb673}
.s{display:flex;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.s:last-child{border-bottom:0}
.s.playing{background:#fff6f2;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px}
.btns{display:flex;flex-direction:column;gap:6px;flex:none}
.pb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--pri);font-size:13px;cursor:pointer;font-weight:700}
.en{font-size:19px;font-weight:700;line-height:1.6}
.w{cursor:pointer;border-radius:4px}
.w:active{background:#ffe3a3}
.ko{font-size:15px;color:var(--sub);line-height:1.5;margin-top:4px;display:none}
.ko.show{display:block}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0}
.row{display:flex;align-items:center;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
.row label{color:var(--sub);font-weight:700;font-size:14px}
.sp{border:1px solid var(--line);background:#fff;border-radius:20px;padding:10px 14px;font-weight:700;color:#666;cursor:pointer;font-size:14px}
.sp.on{background:var(--pri);border-color:var(--pri);color:#fff}
.all{width:100%;border:1.5px solid #222;background:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
.mic{background:#f6f4f2;border-radius:18px;padding:24px;text-align:center;margin-top:14px}
.mic button{width:96px;height:96px;border-radius:50%;border:0;background:var(--pri);font-size:38px;cursor:pointer;color:#fff}
.mic button.rec{animation:pulse 1s infinite;background:#d32f2f}
@keyframes pulse{50%{transform:scale(1.07)}}
.mic p{margin:14px 0 0;color:#555;font-weight:600}
.mic audio{width:100%;margin-top:12px}
.foot{text-align:center;color:var(--sub);padding:6px 0 80px;font-size:14px}
#tip{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;display:none;z-index:9;max-width:90%;text-align:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-top:10px}
.bk{display:flex;gap:8px;margin-top:24px}
.bk .btn{flex:1;padding:11px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header><div style="display:flex;align-items:center;gap:10px"><button class="back" id="back" style="display:none">← 목록</button><span class="logo" id="hTitle">Daily News English</span></div><button class="sync" id="syncBtn">☁ …</button></header>
  <main id="app"></main>
</div>
<div id="tip"></div>
<input type="file" id="impFile" accept=".json,application/json" hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PER = 5; // 세트당 문장 수
const KEY = 'dne_lessons_v1', DKEY = 'dne_dict_v1';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
const DELKEY = 'dne_del_v1';
const VKEY = 'dne_vocab_v1';
let lessons = load(KEY, []), dict = load(DKEY, {}), deleted = load(DELKEY, []), vocab = load(VKEY, []);
const guess = { owner: 'lifekoo112233-cmyk', repo: 'study-english-go' };
if (location.hostname.endsWith('.github.io')) {
  guess.owner = location.hostname.split('.')[0];
  const p = location.pathname.split('/')[1]; if (p && !p.includes('.')) guess.repo = p;
}
const cfg = Object.assign({ owner: '', repo: '', branch: 'main', token: '' }, guess, load('dne_cfg', {}));
const saveLocal = () => { localStorage.setItem(KEY, JSON.stringify(lessons)); localStorage.setItem(DELKEY, JSON.stringify(deleted)); localStorage.setItem(VKEY, JSON.stringify(vocab)); };
const save = () => { saveLocal(); queueSync(); };
const saveDict = () => { try { localStorage.setItem(DKEY, JSON.stringify(dict)); } catch {} };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

let view = 'home', cur = null, setI = 0, rate = 1, alwaysKo = false;
let add = { title: '', date: today(), text: '', rows: null, enN: 0, koN: 0 };
let playToken = 0, playingKey = null, voices = [];
let repS = 1, repAll = 1, playing = false; // repAll 0 = 무한 반복
let keepAwake = localStorage.getItem('dne_wake') !== '0', wakeLock = null;
let vFilter = 'learn', vq = [], vShow = false, installEv = null;

/* ---------- 번역 (MyMemory 무료 API) ---------- */
async function tr(text, cache = true) {
  const k = text.toLowerCase();
  if (cache && dict[k]) return dict[k];
  const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|ko');
  const j = await r.json();
  const t = j.responseData && j.responseData.translatedText;
  if (!t || j.responseStatus != 200 || /MYMEMORY WARNING/i.test(t)) throw new Error('fail');
  if (cache) { dict[k] = t; saveDict(); }
  return t;
}
async function trLong(text) {
  if (text.length <= 450) return tr(text, false);
  const parts = []; let c = '';
  text.split(' ').forEach(w => { if ((c + ' ' + w).length > 450) { parts.push(c); c = w; } else c = c ? c + ' ' + w : w; });
  parts.push(c);
  const out = []; for (const p of parts) out.push(await tr(p, false));
  return out.join(' ');
}

/* ---------- 음성 ---------- */
function loadVoices() { voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en')); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  return voices.find(v => /Google US English|Samantha|Aaron|Microsoft (Aria|Jenny|Guy)/i.test(v.name))
      || voices.find(v => v.lang === 'en-US') || voices[0];
}
function speak(text, r) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = r;
    const v = pickVoice(); if (v) u.voice = v;
    u.onend = u.onerror = res;
    speechSynthesis.speak(u);
  });
}
function stopAll() { playToken++; playingKey = null; playing = false; setPlayBtn(); wakeOff(); if ('speechSynthesis' in window) speechSynthesis.cancel(); }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function wakeOn() {
  if (!keepAwake || !('wakeLock' in navigator) || wakeLock) return;
  try {
    const l = await navigator.wakeLock.request('screen');
    if (!playing && playingKey === null) { l.release(); return; }
    wakeLock = l;
    l.addEventListener('release', () => { if (wakeLock === l) wakeLock = null; });
  } catch {}
}
function wakeOff() { const l = wakeLock; wakeLock = null; if (l) { try { l.release(); } catch {} } }
async function speakN(text, n, t) {
  for (let k = 0; k < n; k++) {
    if (t !== playToken) return false;
    await speak(text, rate);
    if (t !== playToken) return false;
    if (k < n - 1) await wait(500);
  }
  return true;
}
function setPlayBtn() { const b = $('#playAll'); if (b) b.textContent = playing ? '■ 정지' : '🔊 전체 듣기'; }
async function playOne(i) {
  stopAll(); const t = playToken; await wait(60);
  playingKey = i; paintPlaying(); wakeOn();
  await speakN(curSet()[i].en, repS, t);
  if (t === playToken) { playingKey = null; paintPlaying(); wakeOff(); }
}
async function playSet() {
  if (playing) { stopAll(); paintPlaying(); return; }
  stopAll(); const t = playToken; await wait(60);
  if (t !== playToken) return;
  playing = true; setPlayBtn(); wakeOn();
  const ss = curSet();
  for (let r = 0; repAll === 0 || r < repAll; r++) {
    for (let i = 0; i < ss.length; i++) {
      if (t !== playToken) return;
      playingKey = i; paintPlaying();
      const row = document.querySelectorAll('.s')[i];
      if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
      if (!(await speakN(ss[i].en, repS, t))) return;
      await wait(350);
    }
    if (t !== playToken) return;
    await wait(700);
  }
  if (t === playToken) { playing = false; playingKey = null; paintPlaying(); setPlayBtn(); wakeOff(); }
}
function paintPlaying() { document.querySelectorAll('.s').forEach((el, i) => el.classList.toggle('playing', i === playingKey)); }

/* ---------- 문장 분리 ---------- */
const hasKo = s => /[가-힣]/.test(s);
function splitSentences(text) {
  const out = [];
  text.replace(/\r/g, '').split(/\n+/).forEach(line => {
    let t = line.trim(); if (!t) return;
    t = t.replace(/\b(Mr|Mrs|Ms|Dr|St|vs|No)\./g, '$1\u0002').replace(/U\.S\./g, 'U\u0002S\u0002').replace(/U\.K\./g, 'U\u0002K\u0002');
    t = t.replace(/([.!?。]["'”’)\]]*)\s+/g, '$1\u0001');
    t.split('\u0001').forEach(s => { s = s.replace(/\u0002/g, '.').trim(); if (s) out.push(s); });
  });
  return out;
}
function analyze() {
  // 번호(1, 2…)나 ▶ 같은 기호만 있는 줄은 버린다
  const lines = add.text.replace(/\r/g, '').split('\n').map(s => s.trim())
    .filter(s => s && !/^[\d\s.)\-▶►▷▸⏵▶️\uFE0F]+$/.test(s));
  // 영어 한 줄 ↔ 한글 한 줄이 번갈아 나오면 줄 단위로 그대로 짝짓는다
  const alternating = lines.length >= 2 && lines.length % 2 === 0 &&
    lines.every((l, i) => i % 2 === 0 || hasKo(l) !== hasKo(lines[i - 1]));
  if (alternating) {
    add.rows = [];
    for (let i = 0; i < lines.length; i += 2) {
      const a = lines[i], b = lines[i + 1];
      add.rows.push(hasKo(a) ? { en: b, ko: a } : { en: a, ko: b });
    }
    add.enN = add.koN = add.rows.length;
    return;
  }
  // 그 외에는 문장 단위로 나눠서 영어/한글을 따로 모은 뒤 순서대로 짝짓는다
  const sents = splitSentences(lines.join('\n'));
  const en = sents.filter(s => !hasKo(s)), ko = sents.filter(hasKo);
  const n = Math.max(en.length, ko.length);
  add.enN = en.length; add.koN = ko.length;
  add.rows = Array.from({ length: n }, (_, i) => ({ en: en[i] || '', ko: ko[i] || '' }));
}

/* ---------- 진행 기록 ---------- */
const curSet = () => cur.sentences;
const setCount = l => Math.max(1, Math.ceil(l.sentences.length / PER));

/* ---------- 화면 ---------- */
function go(v) { stopAll(); view = v; render(); window.scrollTo(0, 0); }
function render() {
  $('#back').style.display = view === 'home' ? 'none' : '';
  $('#hTitle').textContent = view === 'home' ? 'Daily News English' : view === 'add' ? '새 학습 추가' : view === 'settings' ? '동기화 설정' : view === 'vocab' ? '단어장' : view === 'cards' ? '단어 카드' : '';
  if (view === 'home') renderHome();
  else if (view === 'add') renderAdd();
  else if (view === 'settings') renderSettings();
  else if (view === 'vocab') renderVocab();
  else if (view === 'cards') renderCards();
  else renderStudy();
  setStatus();
}

function renderHome() {
  const list = [...lessons].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  $('#app').innerHTML = `<div class="pad">
    <button class="btn full" id="newBtn">＋ 새 학습 추가</button>
    <button class="btn gray full" id="vocabBtn" style="margin-top:8px">📒 단어장 (${vActive().length}개)</button>
    ${list.length ? list.map(l => `
      <div class="item" data-open="${l.id}">
        <div><b>${esc(l.title)}</b><small>${esc(l.date)} · ${l.sentences.length}문장</small></div>
        <button class="x" data-del="${l.id}">삭제</button>
      </div>`).join('') :
      `<div class="empty">아직 학습이 없어요.<br>위의 <b>＋ 새 학습 추가</b>를 눌러<br>영어 원문과 한글 번역을 붙여넣어 보세요.</div>`}
    <div class="bk">
      <button class="btn gray" id="exp">백업 저장</button>
      <button class="btn gray" id="imp">백업 불러오기</button>
      <button class="btn gray" id="cfgBtn">⚙ 동기화</button>
    </div>
    ${installHtml()}
    <p class="hint" style="text-align:center">${cfg.token ? '학습 내용이 GitHub에 자동 저장·동기화돼요.' : '지금은 이 기기에만 저장돼요. ⚙ 동기화에서 GitHub 토큰을 넣으면 폰·PC가 연동돼요.'}</p>
  </div>`;
}

function renderAdd() {
  if (!add.rows) {
    $('#app').innerHTML = `<div class="pad">
      <label class="l">제목 (비우면 첫 문장으로 자동)</label>
      <input class="t" id="aTitle" value="${esc(add.title)}" placeholder="예: 프랑스 예산 삭감과 시위">
      <label class="l">날짜</label>
      <input class="t" id="aDate" type="date" value="${esc(add.date)}">
      <label class="l">원문 붙여넣기 (영어 + 한글 번역)</label>
      <textarea class="t" id="aText" placeholder="영어 원문과 한글 번역을 같이 붙여넣으세요.">${esc(add.text)}</textarea>
      <p class="hint">영어와 한글이 따로 붙어 있어도, 줄마다 섞여 있어도 자동으로 문장을 나눠 짝을 맞춰요. 한글 없이 영어만 넣어도 돼요(번역은 버튼으로 자동 생성).</p>
      <button class="btn full" id="analyze" style="margin-top:14px">문장 나누기</button>
    </div>`;
    return;
  }
  const mismatch = add.koN > 0 && add.enN !== add.koN;
  $('#app').innerHTML = `<div class="pad">
    <div class="info">영어 <b>${add.enN}</b>문장 · 한글 <b>${add.koN}</b>문장으로 나눴어요. 아래에서 확인하고 고친 뒤 저장하세요.</div>
    ${mismatch ? `<div class="warn">영어와 한글 문장 수가 달라서 짝이 어긋났을 수 있어요. 어긋난 곳은 <b>다음과 합치기</b>/<b>삭제</b>로 맞추거나 칸을 직접 고쳐 주세요.</div>` : ''}
    ${add.koN === 0 ? `<div class="info">한글 번역이 없어요. 저장 후 문장 옆 <b>한</b> 버튼을 누르면 자동 번역돼요.</div>` : ''}
    ${add.rows.map((r, i) => `
      <div class="prow">
        <span class="no">${i + 1}</span>
        <button class="mini" data-merge="${i}">다음과 합치기</button><button class="mini" data-rdel="${i}">삭제</button>
        <textarea data-r="${i}" data-f="en" placeholder="영어">${esc(r.en)}</textarea>
        <textarea data-r="${i}" data-f="ko" placeholder="한글">${esc(r.ko)}</textarea>
      </div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn gray" id="reedit" style="flex:1">← 원문 수정</button>
      <button class="btn" id="saveLesson" style="flex:2">저장하고 학습하기</button>
    </div>
  </div>`;
}

function enHtml(t) {
  return t.split(/(\s+)/).map(p => {
    if (!p.trim()) return p;
    const w = p.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
    return w ? `<span class="w" data-w="${esc(w)}">${esc(p)}</span>` : esc(p);
  }).join('');
}

function renderStudy() {
  const ss = curSet();
  const opt = (arr, val, attr, fmt) => arr.map(v => `<button class="sp ${v === val ? 'on' : ''}" data-${attr}="${v}">${fmt(v)}</button>`).join('');
  $('#app').innerHTML = `
  <div class="card">
    <div class="top"><span class="badge">${esc(cur.date)} · ${ss.length}문장</span></div>

let tipTimer;

function saveLesson() {
  const rows = add.rows.map(r => ({ en: r.en.trim(), ko: r.ko.trim() })).filter(r => r.en);

/* ---------- 단어장 ---------- */
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function addVocab(w, ko, sent, lid) {
  const k = w.toLowerCase();
  if (k.length < 3 || /^\d+$/.test(k)) return false;
  const now = Date.now();
  const old = vocab.find(x => x.k === k);
  if (old && !old.del) { old.hits = (old.hits || 1) + 1; old.updated = now; save(); return false; }
  const item = { k, w, ko, en: sent ? sent.en : '', sko: sent ? (sent.ko || '') : '', lid: lid || '', hits: 1, known: false, del: false, added: now, updated: now };
  if (old) Object.assign(old, item); else vocab.push(item);
  save(); return true;
}
function vexHtml(v) {
  if (!v.en) return '';
  const h = esc(v.en).replace(new RegExp('(^|[^\\w])(' + reEsc(esc(v.w)) + ')(?![\\w])', 'i'), (m, a, b) => a + '<mark>' + b + '</mark>');
  return `<div class="vex">${h}${v.sko ? '<br>' + esc(v.sko) : ''}</div>`;
}
function vocabItemHtml(v) {

    <div class="vact"><button class="${v.known ? '' : 'ok'}" data-vknown="${esc(v.k)}">${v.known ? '↩ 다시 외우기' : '✓ 외웠어요'}</button><button data-vdel="${esc(v.k)}">삭제</button></div>
  </div>`;
}
function renderVocab() {
  const all = vActive(), learn = all.filter(v => !v.known), known = all.filter(v => v.known);
  const list = (vFilter === 'learn' ? learn : vFilter === 'known' ? known : all).slice().sort((a, b) => (b.updated || 0) - (a.updated || 0));
  $('#app').innerHTML = `<div class="pad">

  </div>`;
}
function vSpeak(k) { const v = vocab.find(x => x.k === k); if (!v) return; stopAll(); setTimeout(() => speak(v.w, rate), 60); }
function vSpeakCur() { if (vq.length) vSpeak(vq[0]); }
function vMarkKnown(k) { const v = vocab.find(x => x.k === k); if (v) { v.known = true; v.updated = Date.now(); save(); } }
function vToggleKnown(k) { const v = vocab.find(x => x.k === k); if (v) { v.known = !v.known; v.updated = Date.now(); save(); render(); } }
function vDelete(k) {

}
function vEdit(k) {

}
function startCards() {
  vq = vActive().filter(v => !v.known).map(v => v.k);
  for (let i = vq.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [vq[i], vq[j]] = [vq[j], vq[i]]; }

/* ---------- GitHub 동기화 ---------- */
const FILE = 'data/lessons.json';
let sha = null, syncState = cfg.token ? 'saving' : 'local', lastErr = '', syncing = false, again = false, qTimer;
const apiUrl = p => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`;
const hdr = () => ({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' });
function b64(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
const canon = (ls, del, vs = []) => JSON.stringify({ l: ls.map(l => l.id + ':' + (l.updated || l.created)).sort(), d: [...del].sort(), v: vs.map(v => v.k + ':' + (v.updated || 0)).sort() });
function merge(remote) {
  const del = new Set([...deleted, ...(remote.deleted || [])]); deleted = [...del];
  const map = new Map();
  [...lessons, ...(remote.lessons || [])].forEach(l => {
    if (del.has(l.id)) return;
    const o = map.get(l.id);
    if (!o || (l.updated || l.created) > (o.updated || o.created)) map.set(l.id, l);
  });
  lessons = [...map.values()];
  const vm = new Map();
  [...vocab, ...(remote.vocab || [])].forEach(v => { const o = vm.get(v.k); if (!o || (v.updated || 0) > (o.updated || 0)) vm.set(v.k, v); });
  vocab = [...vm.values()];
}
async function pull() {
  let remote = { lessons: [], deleted: [] };
  if (cfg.token) {
    const r = await fetch(apiUrl(FILE) + `?ref=${cfg.branch}&t=${Date.now()}`, { headers: hdr(), cache: 'no-store' });
    if (r.status === 404) {
      sha = null;
      const rr = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`, { headers: hdr() });
      if (!rr.ok) throw new Error('저장소를 찾을 수 없거나 토큰 권한이 없어요. 사용자명/저장소 이름/토큰을 확인하세요.');
    } else if (r.ok) {
      const j = await r.json(); sha = j.sha; remote = JSON.parse(unb64(j.content));
    } else throw new Error(r.status === 401 ? '토큰이 올바르지 않아요.' : '불러오기 실패 (' + r.status + ')');
  } else {
    const r = await fetch(FILE + '?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) { try { remote = await r.json(); } catch {} }
  }
  const before = canon(remote.lessons || [], remote.deleted || [], remote.vocab || []);
  merge(remote); saveLocal();
  return before;
}
async function push(retry = true) {
  const body = { message: 'sync ' + new Date().toISOString(), content: b64(JSON.stringify({ lessons, deleted, vocab }, null, 1)), branch: cfg.branch };
  if (sha) body.sha = sha;
  const r = await fetch(apiUrl(FILE), { method: 'PUT', headers: hdr(), body: JSON.stringify(body) });
  if (r.ok) { sha = (await r.json()).content.sha; return; }
  if ((r.status === 409 || r.status === 422) && retry) { await pull(); return push(false); }
  throw new Error(r.status === 401 || r.status === 403 ? '저장 권한이 없어요. 토큰의 Contents 권한을 "Read and write"로 확인하세요.' : '저장 실패 (' + r.status + ')');
}
async function syncNow() {
  if (!cfg.token) { setStatus('local'); return; }
  if (syncing) { again = true; return; }
  syncing = true; setStatus('saving');
  try {
    do {
      again = false;
      const before = await pull();
      if (before !== canon(lessons, deleted, vocab)) await push();
    } while (again);
    setStatus('ok');
  } catch (e) { lastErr = navigator.onLine === false ? '오프라인이에요. 인터넷에 연결되면 자동으로 동기화돼요.' : (e.message || String(e)); setStatus('err'); }
  syncing = false;
  if (cur) cur = lessons.find(l => l.id === cur.id) || cur;
  if (view === 'home') render();
}
function queueSync() { if (!cfg.token) { setStatus('local'); return; } clearTimeout(qTimer); qTimer = setTimeout(syncNow, 800); }
function setStatus(s) {
  if (s) syncState = s;
  const b = $('#syncBtn'); if (!b) return;
  const m = { local: '☁ 연동 설정', saving: '☁ 동기화 중…', ok: '☁ 동기화됨', err: '☁ 오류 (눌러보기)' };
  b.textContent = m[syncState]; b.className = 'sync ' + (syncState === 'ok' ? 'ok' : syncState === 'err' ? 'err' : '');
}
function renderSettings() {
  $('#app').innerHTML = `<div class="pad">
    <div class="info">GitHub 토큰을 넣으면 학습 내용이 저장소의 <b>data/lessons.json</b>에 자동 저장되고, 폰과 PC가 같은 내용을 보게 돼요. <b>폰과 PC 각각에서 한 번씩</b> 입력하세요.</div>
    <label class="l">GitHub 토큰</label><input class="t" id="cfgToken" type="password" value="${esc(cfg.token)}" placeholder="github_pat_...">
    <label class="l">사용자명</label><input class="t" id="cfgOwner" value="${esc(cfg.owner)}">
    <label class="l">저장소 이름</label><input class="t" id="cfgRepo" value="${esc(cfg.repo)}">
    <label class="l">브랜치</label><input class="t" id="cfgBranch" value="${esc(cfg.branch)}">
    <button class="btn full" id="cfgSave" style="margin-top:16px">저장하고 동기화</button>
    <p class="hint">토큰 만드는 법: GitHub 프로필 → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token → 이 저장소만 선택 → Repository permissions의 <b>Contents</b>를 <b>Read and write</b>로.</p>
    ${cfg.token ? '<button class="btn gray full" id="cfgClear" style="margin-top:8px">이 기기에서 토큰 지우기</button>' : ''}
  </div>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('input', e => {

  if (t.id === 'alwaysKo') { alwaysKo = t.checked; render(); return; }
  if (t.id === 'playAll') return playSet();
  if (c('.w')) { const row = c('.w').closest('.s'); return wordTap(c('.w').dataset.w, [...document.querySelectorAll('.s')].indexOf(row)); }
});

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; if (view === 'home') render(); });
window.addEventListener('appinstalled', () => { installEv = null; if (view === 'home') render(); });
window.addEventListener('online', () => syncNow());
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
syncNow();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (view === 'home') syncNow();
  if (playing || playingKey !== null) wakeOn();
});
</script>
</body>
</html>
