<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily News English · 관리</title>
<style>
:root{--pri:#ff5722;--line:#e5e5e5}
*{box-sizing:border-box}
body{margin:0;background:#faf8f6;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1a1a1a}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{color:var(--pri);font-size:22px;margin:6px 0 14px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.box h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:#666;margin:8px 0 3px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14px;font-family:inherit}
textarea{min-height:120px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;margin:10px 8px 0 0}
button.gray{background:#eee;color:#333}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#fcfcfc}
.item .no{font-size:12px;color:var(--pri);font-weight:700}
.item textarea{min-height:56px}
.setbar{margin-top:14px;font-weight:700;color:#444}
pre{background:#222;color:#cfe;padding:12px;border-radius:10px;overflow:auto;max-height:260px;font-size:12px}
#log{font-size:13px;color:#2a7;white-space:pre-wrap;margin-top:8px}
small{color:#888}
</style>
</head>
<body>
<div class="wrap">
<h1>학습 자료 입력</h1>

<div class="box">
  <h2>① 설정 (이 브라우저에만 저장됨)</h2>
  <div class="g2">
    <div><label>GitHub 사용자명</label><input id="owner" placeholder="myname"></div>
    <div><label>저장소 이름</label><input id="repo" placeholder="english-app"></div>
    <div><label>브랜치</label><input id="branch" value="main"></div>
    <div><label>GitHub 토큰 (repo contents 쓰기 권한)</label><input id="ghToken" type="password" placeholder="github_pat_..."></div>
  </div>
  <label>OpenAI API 키 (번역/단어 자동 생성용, 선택)</label>
  <input id="aiKey" type="password" placeholder="sk-...">
  <button class="gray" id="saveCfg">설정 저장</button>
  <small>※ 토큰은 본인 브라우저(localStorage)에만 저장됩니다. 이 페이지는 본인만 쓰고 토큰을 공유하지 마세요.</small>
</div>

<div class="box">
  <h2>② 영어 본문 붙여넣기</h2>
  <div class="g2">
    <div><label>날짜</label><input id="date" type="date"></div>
    <div><label>제목 (한글)</label><input id="title" placeholder="프랑스 예산 삭감과 시위"></div>
  </div>
  <label>영어 본문 (스크립트/기사)</label>
  <textarea id="src" placeholder="영어 본문을 붙여넣으세요"></textarea>
  <div class="g2"><div><label>세트당 문장 수</label><input id="per" type="number" value="5" min="1" max="10"></div><div></div></div>
  <button id="split">문장 나누기</button>
</div>

<div class="box">
  <h2>③ 번역·단어 확인 / 수정</h2>
  <button id="ai" class="gray">🤖 AI로 번역·핵심 단어 채우기</button>
  <small>번역칸을 직접 써도 됩니다. 단어는 <b>단어=뜻, 단어=뜻</b> 형식으로 입력.</small>
  <div id="list"></div>
</div>

<div class="box">
  <h2>④ 저장</h2>
  <button id="push">GitHub에 바로 저장</button>
  <button id="dl" class="gray">JSON 다운로드</button>
  <div id="log"></div>
  <details><summary style="margin-top:10px;cursor:pointer">JSON 미리보기</summary><pre id="out"></pre></details>
</div>
</div>

<script>
const $ = s => document.querySelector(s);
let items = []; // {en, ko, words:"a=b, c=d"}

/* 설정 */
['owner','repo','branch','ghToken','aiKey'].forEach(k => { const v = localStorage.getItem('adm_' + k); if (v) $('#' + k).value = v; });
$('#saveCfg').onclick = () => { ['owner','repo','branch','ghToken','aiKey'].forEach(k => localStorage.setItem('adm_' + k, $('#' + k).value.trim())); log('설정을 저장했습니다.'); };
$('#date').value = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const log = t => $('#log').textContent = t;

/* 문장 분리 */
$('#split').onclick = () => {
  const text = $('#src').value.replace(/\s+/g, ' ').trim();
  if (!text) return log('본문을 입력하세요.');
  const arr = text.match(/[^.!?]+[.!?]+["'”’)]*|[^.!?]+$/g) || [];
  items = arr.map(s => ({ en: s.trim(), ko: '', words: '' })).filter(x => x.en);
  renderList(); log(`${items.length}문장으로 나눴습니다.`);
};

function renderList() {
  const per = +$('#per').value || 5;
  $('#list').innerHTML = items.map((it, i) => `
    ${i % per === 0 ? `<div class="setbar">세트 ${i / per + 1}</div>` : ''}
    <div class="item">
      <span class="no">${i + 1}</span> <button class="gray" style="padding:3px 9px;margin:0 0 0 6px" data-del="${i}">삭제</button>
      <textarea data-f="en" data-i="${i}">${esc(it.en)}</textarea>
      <textarea data-f="ko" data-i="${i}" placeholder="한글 번역">${esc(it.ko)}</textarea>
      <input data-f="words" data-i="${i}" placeholder="deficit=적자, roll over=차환하다" value="${esc(it.words)}">
    </div>`).join('');
  build();
}
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#list').addEventListener('input', e => { const d = e.target.dataset; if (d.f) { items[d.i][d.f] = e.target.value; build(); } });
$('#list').addEventListener('click', e => { if (e.target.dataset.del) { items.splice(+e.target.dataset.del, 1); renderList(); } });
$('#per').onchange = renderList;

/* JSON 만들기 */
function parseWords(s) {
  return (s || '').split(',').map(x => x.trim()).filter(Boolean).map(x => { const [w, ...k] = x.split('='); return { w: w.trim(), ko: k.join('=').trim() }; }).filter(x => x.w && x.ko);
}
function build() {
  const per = +$('#per').value || 5, sets = [];
  for (let i = 0; i < items.length; i += per)
    sets.push({ sentences: items.slice(i, i + per).map(it => ({ en: it.en, ko: it.ko, words: parseWords(it.words) })) });
  const data = { date: $('#date').value, title: $('#title').value.trim(), sets };
  $('#out').textContent = JSON.stringify(data, null, 2);
  return data;
}
['date', 'title'].forEach(k => $('#' + k).addEventListener('input', build));

/* AI 번역 (OpenAI) */
$('#ai').onclick = async () => {
  const key = $('#aiKey').value.trim();
  if (!key) return log('OpenAI API 키를 입력하세요.');
  if (!items.length) return log('먼저 문장을 나누세요.');
  log('AI 생성 중…'); $('#ai').disabled = true;
  try {
    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: '너는 영어 학습 앱의 편집자다. 입력된 영어 문장 배열 각각에 대해 자연스러운 한국어 번역(ko)과, 학습할 만한 핵심 단어/표현 1~3개(words: [{w, ko}])를 만든다. w는 반드시 원문에 그대로 등장하는 철자여야 한다. 입력과 같은 순서·개수로 {"items":[{"ko":"","words":[{"w":"","ko":""}]}]} JSON만 출력.' },
          { role: 'user', content: JSON.stringify(items.map(i => i.en)) }
        ]
      })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || r.status);
    const res = JSON.parse(j.choices[0].message.content).items;
    res.forEach((x, i) => { if (items[i]) { items[i].ko = x.ko || ''; items[i].words = (x.words || []).map(w => `${w.w}=${w.ko}`).join(', '); } });
    renderList(); log('완료! 내용을 확인하고 수정한 뒤 저장하세요.');
  } catch (e) { log('AI 오류: ' + e.message); }
  $('#ai').disabled = false;
};

/* 다운로드 */
$('#dl').onclick = () => {
  const d = build(); if (!d.sets.length) return log('내용이 없습니다.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }));
  a.download = d.date + '.json'; a.click();
  log('다운로드 후 저장소의 data/ 폴더에 올리고, data/index.json에 날짜를 추가하세요.');
};

/* GitHub 저장 */
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
async function gh(path, opt = {}) {
  const o = $('#owner').value.trim(), r = $('#repo').value.trim(), b = $('#branch').value.trim() || 'main';
  const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/${path}${opt.method === 'PUT' ? '' : '?ref=' + b}`, {
    ...opt, headers: { Authorization: 'Bearer ' + $('#ghToken').value.trim(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }
  });
  return res;
}
async function putFile(path, content, msg) {
  const b = $('#branch').value.trim() || 'main';
  const cur = await gh(path); let sha;
  if (cur.ok) sha = (await cur.json()).sha;
  const res = await gh(path, { method: 'PUT', body: JSON.stringify({ message: msg, content: b64(content), branch: b, sha }) });
  if (!res.ok) throw new Error(path + ' 저장 실패: ' + ((await res.json()).message || res.status));
}
$('#push').onclick = async () => {
  const d = build();
  if (!d.date || !d.sets.length) return log('날짜와 내용을 확인하세요.');
  if (!$('#owner').value || !$('#repo').value || !$('#ghToken').value) return log('GitHub 설정을 입력하세요.');
  log('저장 중…');
  try {
    // index.json 병합
    let idx = { lessons: [] };
    const cur = await gh('data/index.json');
    if (cur.ok) idx = JSON.parse(unb64((await cur.json()).content));
    idx.lessons = idx.lessons.filter(l => l.date !== d.date);
    idx.lessons.push({ date: d.date, title: d.title });
    idx.lessons.sort((a, b) => b.date.localeCompare(a.date));
    await putFile(`data/${d.date}.json`, JSON.stringify(d, null, 2), `add lesson ${d.date}`);
    await putFile('data/index.json', JSON.stringify(idx, null, 2), `update index ${d.date}`);
    log(`저장 완료! 1~2분 뒤 앱에 반영됩니다. (${d.date})`);
  } catch (e) { log(e.message); }
};
</script>
</body>
</html>
